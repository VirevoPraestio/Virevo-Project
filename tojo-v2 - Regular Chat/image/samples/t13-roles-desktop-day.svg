<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 528" font-family="Poppins,'Segoe UI',Verdana,sans-serif"><style>text{text-anchor:middle}.t{font-weight:600}.v{font-weight:700}.c{font-weight:400}.i{font-weight:400;font-style:italic}.g{font-weight:700;text-anchor:end}.h{font-weight:700;text-anchor:start}.s{font-weight:400;text-anchor:start}.f{font-weight:400;text-anchor:start}</style><rect width="880" height="528" fill="#f1f5f9"/><text x="40" y="64" class="h" fill="#0f2740" font-size="30">Who Has to Cooperate</text><text x="40" y="90" class="s" fill="#4d6076" font-size="18">And what each is actually being asked for</text><text x="40" y="500" class="f" fill="#71839a" font-size="12">tpl · role-cards · v2</text><g transform="translate(0 12)"><rect x="40" y="112" width="253" height="163" rx="8" fill="#ffffff" stroke="#b0c0d1" stroke-width="1.2"/><text x="167" y="172" class="t" fill="#0f2740" font-size="17">Ward nurses</text><text x="167" y="202" class="v" fill="#0c6b4f" font-size="17">No extra time</text><text x="167" y="228" class="c" fill="#4d6076" font-size="14">Confirm, not produce</text><rect x="313" y="112" width="253" height="163" rx="8" fill="#ffffff" stroke="#9a6205" stroke-width="2"/><text x="440" y="136" class="v" fill="#9a6205" font-size="14">MOST TO LOSE</text><text x="440" y="163" class="t" fill="#0f2740" font-size="17">Consultants</text><text x="440" y="193" class="v" fill="#0c6b4f" font-size="17">Sign a draft, not</text><text x="440" y="217" class="v" fill="#0c6b4f" font-size="17">write one</text><text x="440" y="242" class="c" fill="#4d6076" font-size="14">Gives up the 'my own words'</text><text x="440" y="261" class="c" fill="#4d6076" font-size="14">summary</text><rect x="587" y="112" width="253" height="163" rx="8" fill="#ffffff" stroke="#b0c0d1" stroke-width="1.2"/><text x="713" y="172" class="t" fill="#0f2740" font-size="17">Billing desk</text><text x="713" y="202" class="v" fill="#0c6b4f" font-size="17">Work from a cascade</text><text x="713" y="228" class="c" fill="#4d6076" font-size="14">Starts earlier, same work</text><rect x="160" y="301" width="560" height="96" rx="8" fill="#ffffff" stroke="#0c6b4f" stroke-width="2"/><text x="399" y="328" class="t" fill="#0f2740" font-size="17">Medical Superintendent</text><text x="440" y="358" class="v" fill="#0c6b4f" font-size="17">Approves the sign-off change</text><text x="440" y="383" class="c" fill="#4d6076" font-size="14">Outside the daily routine — easy to leave out</text><text x="712" y="325" class="g" fill="#0c6b4f" font-size="14">APPROVES</text><line x1="40" y1="415" x2="840" y2="415" stroke="#a6b8cb" stroke-width="1" stroke-dasharray="5 4"/><text x="440" y="437" class="i" fill="#4d6076" font-size="14">Without this approval the draft is written and never signed, and the evening work is wasted.</text></g></svg>