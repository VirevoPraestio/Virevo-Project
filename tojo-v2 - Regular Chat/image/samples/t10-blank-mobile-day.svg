<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 880" font-family="Poppins,'Segoe UI',Verdana,sans-serif"><style>text{text-anchor:middle}.t{font-weight:600}.v{font-weight:700}.c{font-weight:400}.i{font-weight:400;font-style:italic}.g{font-weight:700;text-anchor:end}.h{font-weight:700;text-anchor:start}.s{font-weight:400;text-anchor:start}.f{font-weight:400;text-anchor:start}</style><rect width="660" height="880" fill="#f1f5f9"/><text x="60" y="89" class="h" fill="#0f2740" font-size="35">Your Four Timestamps</text><text x="60" y="118" class="s" fill="#4d6076" font-size="21">Fill these in and the rest of the</text><text x="60" y="142" class="s" fill="#4d6076" font-size="21">arithmetic follows</text><text x="60" y="834" class="f" fill="#71839a" font-size="14">tpl · fill-in-the-blank · v2</text><g transform="translate(0 35)"><rect x="60" y="164" width="540" height="106" rx="8" fill="#ffffff" stroke="#b0c0d1" stroke-width="1.2"/><text x="330" y="194" class="t" fill="#0f2740" font-size="20">Doctor's round</text><text x="330" y="228" class="v" fill="#0c6b4f" font-size="20"></text><text x="330" y="256" class="c" fill="#4d6076" font-size="16">When is the decision taken?</text><rect x="195" y="205" width="270" height="32" rx="4" fill="none" stroke="#4d6076" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.75"/><path d="M330 274V285" stroke="#0c6b4f" stroke-width="1.6" fill="none"/><path d="M330 292l-4 -7h9z" fill="#0c6b4f"/><rect x="60" y="294" width="540" height="106" rx="8" fill="#ffffff" stroke="#b0c0d1" stroke-width="1.2"/><text x="330" y="324" class="t" fill="#0f2740" font-size="20">Summary signed</text><text x="330" y="358" class="v" fill="#0c6b4f" font-size="20"></text><text x="330" y="386" class="c" fill="#4d6076" font-size="16">When is it actually signed?</text><rect x="195" y="335" width="270" height="32" rx="4" fill="none" stroke="#4d6076" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.75"/><path d="M330 404V415" stroke="#0c6b4f" stroke-width="1.6" fill="none"/><path d="M330 422l-4 -7h9z" fill="#0c6b4f"/><rect x="60" y="424" width="540" height="106" rx="8" fill="#ffffff" stroke="#b0c0d1" stroke-width="1.2"/><text x="330" y="454" class="t" fill="#0f2740" font-size="20">Billing cleared</text><text x="330" y="488" class="v" fill="#0c6b4f" font-size="20"></text><text x="330" y="516" class="c" fill="#4d6076" font-size="16">When does the bill close?</text><rect x="195" y="465" width="270" height="32" rx="4" fill="none" stroke="#4d6076" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.75"/><path d="M330 534V545" stroke="#0c6b4f" stroke-width="1.6" fill="none"/><path d="M330 552l-4 -7h9z" fill="#0c6b4f"/><rect x="60" y="554" width="540" height="106" rx="8" fill="#ffffff" stroke="#b0c0d1" stroke-width="1.2"/><text x="330" y="584" class="t" fill="#0f2740" font-size="20">Patient leaves</text><text x="330" y="618" class="v" fill="#0c6b4f" font-size="20"></text><text x="330" y="646" class="c" fill="#4d6076" font-size="16">When is the bed physically free?</text><rect x="195" y="595" width="270" height="32" rx="4" fill="none" stroke="#4d6076" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.75"/><line x1="60" y1="678" x2="600" y2="678" stroke="#a6b8cb" stroke-width="1" stroke-dasharray="5 4"/><text x="330" y="702" class="i" fill="#4d6076" font-size="16">Approximate is fine. A typical weekday, not the best</text><text x="330" y="721" class="i" fill="#4d6076" font-size="16">one.</text></g></svg>