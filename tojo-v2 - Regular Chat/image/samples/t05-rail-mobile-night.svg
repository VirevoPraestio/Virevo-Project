<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 880" font-family="Poppins,'Segoe UI',Verdana,sans-serif"><style>text{text-anchor:middle}.t{font-weight:600}.v{font-weight:700}.c{font-weight:400}.i{font-weight:400;font-style:italic}.g{font-weight:700;text-anchor:end}.h{font-weight:700;text-anchor:start}.s{font-weight:400;text-anchor:start}.f{font-weight:400;text-anchor:start}</style><rect width="660" height="880" fill="#0f2740"/><text x="60" y="89" class="h" fill="#ffffff" font-size="35">What Feeds the Morning</text><text x="60" y="128" class="h" fill="#ffffff" font-size="35">Bed Position</text><text x="60" y="157" class="s" fill="#9fb8cf" font-size="21">Four sources, one number</text><text x="60" y="834" class="f" fill="#6d88a3" font-size="14">tpl · converging-rail · v2</text><g transform="translate(0 78)"><text x="60" y="179" class="s" fill="#9fb8cf" font-size="20" font-weight="500">COLLECTED THE NIGHT BEFORE</text><rect x="60" y="211" width="260" height="108" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="190" y="241" class="t" fill="#eaf1f8" font-size="20">Expected discharges</text><text x="190" y="275" class="v" fill="#7be0b8" font-size="20">From the evening</text><text x="190" y="303" class="v" fill="#7be0b8" font-size="20">round</text><rect x="340" y="211" width="260" height="108" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="470" y="255" class="t" fill="#eaf1f8" font-size="20">Booked admissions</text><text x="470" y="289" class="v" fill="#7be0b8" font-size="20">Elective list</text><rect x="60" y="339" width="260" height="80" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="190" y="369" class="t" fill="#eaf1f8" font-size="20">ICU step-downs</text><text x="190" y="403" class="v" fill="#7be0b8" font-size="20">Flagged at 22:00</text><rect x="340" y="339" width="260" height="80" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="470" y="369" class="t" fill="#eaf1f8" font-size="2