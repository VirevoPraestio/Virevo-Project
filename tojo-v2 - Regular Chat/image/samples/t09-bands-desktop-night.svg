<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 576" font-family="Poppins,'Segoe UI',Verdana,sans-serif"><style>text{text-anchor:middle}.t{font-weight:600}.v{font-weight:700}.c{font-weight:400}.i{font-weight:400;font-style:italic}.g{font-weight:700;text-anchor:end}.h{font-weight:700;text-anchor:start}.s{font-weight:400;text-anchor:start}.f{font-weight:400;text-anchor:start}</style><rect width="960" height="576" fill="#0f2740"/><text x="40" y="64" class="h" fill="#ffffff" font-size="30">How the Evening Draft Actually Gets Built</text><text x="40" y="90" class="s" fill="#9fb8cf" font-size="18">Not many systems — three</text><text x="40" y="548" class="f" fill="#6d88a3" font-size="12">tpl · bands · v2</text><text x="40" y="112" class="s" fill="#9fb8cf" font-size="17" font-weight="500">INPUTS — ALL ALREADY EXIST</text><rect x="40" y="139" width="281" height="72" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="181" y="166" class="t" fill="#eaf1f8" font-size="17">Vitals and notes</text><text x="181" y="196" class="v" fill="#7be0b8" font-size="17">From the HIS</text><rect x="339" y="139" width="281" height="72" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="480" y="166" class="t" fill="#eaf1f8" font-size="17">Medication chart</text><text x="480" y="196" class="v" fill="#7be0b8" font-size="17">From pharmacy</text><rect x="639" y="139" width="281" height="72" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="779" y="166" class="t" fill="#eaf1f8" font-size="17">Investigation results</text><text x="779" y="196" class="v" fill="#7be0b8" font-size="17">From the lab</text><path d="M480 217V230" stroke="#7be0b8" stroke-width="1.6" fill="none"/><path d="M480 237l-4 -7h9z" fill="#7be0b8"/><text x="40" y="241" class="s" fill="#9fb8cf" font-size="17" font-weight="500">ENGINE</text><rect x="40" y="268" width="880" height="72" rx="8" fill="#1c3f61" stroke="#7be0b8" stroke-width="2"/><text x="480" y="295" class="t" fill="#eaf1f8" font-size="17">Draft assembler</text><text x="480" y="325" class="v" fill="#7be0b8" font-size="17">One service, triggered at 18:00</text><path d="M480 346V359" stroke="#7be0b8" stroke-width="1.6" fill="none"/><path d="M480 366l-4 -7h9z" fill="#7be0b8"/><text x="40" y="370" class="s" fill="#9fb8cf" font-size="17" font-weight="500">OUTPUTS</text><rect x="40" y="397" width="431" height="72" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="256" y="424" class="t" fill="#eaf1f8" font-size="17">Draft summary</text><text x="256" y="454" class="v" fill="#7be0b8" font-size="17">Awaiting sign-off</text><rect x="489" y="397" width="431" height="72" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="704" y="424" class="t" fill="#eaf1f8" font-size="17">Provisional bill</text><text x="704" y="454" class="v" fill="#7be0b8" font-size="17">Cascades on sign-off</text><line x1="40" y1="487" x2="920" y2="487" stroke="#3a5f84" stroke-width="1" stroke-dasharray="5 4"/><text x="480" y="509" class="i" fill="#9fb8cf" font-size="14">Nothing here asks a clinician to enter something they do not already enter.</text></svg>