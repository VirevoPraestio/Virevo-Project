<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 880" font-family="Poppins,'Segoe UI',Verdana,sans-serif"><style>text{text-anchor:middle}.t{font-weight:600}.v{font-weight:700}.c{font-weight:400}.i{font-weight:400;font-style:italic}.g{font-weight:700;text-anchor:end}.h{font-weight:700;text-anchor:start}.s{font-weight:400;text-anchor:start}.f{font-weight:400;text-anchor:start}</style><rect width="660" height="880" fill="#0f2740"/><text x="60" y="89" class="h" fill="#ffffff" font-size="35">How the Evening Draft</text><text x="60" y="128" class="h" fill="#ffffff" font-size="35">Actually Gets Built</text><text x="60" y="157" class="s" fill="#9fb8cf" font-size="21">Not many systems — three</text><text x="60" y="834" class="f" fill="#6d88a3" font-size="14">tpl · bands · v2</text><g transform="translate(0 4)"><text x="60" y="179" class="s" fill="#9fb8cf" font-size="20" font-weight="500">INPUTS — ALL ALREADY EXIST</text><rect x="60" y="209" width="261" height="80" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="190" y="239" class="t" fill="#eaf1f8" font-size="20">Vitals and notes</text><text x="190" y="273" class="v" fill="#7be0b8" font-size="20">From the HIS</text><rect x="339" y="209" width="261" height="80" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="470" y="239" class="t" fill="#eaf1f8" font-size="20">Medication chart</text><text x="470" y="273" class="v" fill="#7be0b8" font-size="20">From pharmacy</text><rect x="60" y="307" width="261" height="107" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="190" y="337" class="t" fill="#eaf1f8" font-size="20">Investigation</text><text x="190" y="364" class="t" fill="#eaf1f8" font-size="20">results</text><text x="190" y="398" class="v" fill="#7be0b8" font-size="20">From the lab</text><path d="M330 420V433" stroke="#7be0b8" stroke-width="1.6" fill="none"/><path d="M330 440l-4 -7h9z" fill="#7be0b8"/><text x="60" y="444" class="s" fill="#9fb8cf" font-size="20" font-weight="500">ENGINE</text><rect x="60" y="474" width="540" height="80" rx="8" fill="#1c3f61" stroke="#7be0b8" stroke-width="2"/><text x="330" y="504" class="t" fill="#eaf1f8" font-size="20">Draft assembler</text><text x="330" y="538" class="v" fill="#7be0b8" font-size="20">One service, triggered at 18:00</text><path d="M330 560V573" stroke="#7be0b8" stroke-width="1.6" fill="none"/><path d="M330 580l-4 -7h9z" fill="#7be0b8"/><text x="60" y="584" class="s" fill="#9fb8cf" font-size="20" font-weight="500">OUTPUTS</text><rect x="60" y="614" width="261" height="108" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="190" y="658" class="t" fill="#eaf1f8" font-size="20">Draft summary</text><text x="190" y="692" class="v" fill="#7be0b8" font-size="20">Awaiting sign-off</text><rect x="339" y="614" width="261" height="108" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="470" y="644" class="t" fill="#eaf1f8" font-size="20">Provisional bill</text><text x="470" y="678" class="v" fill="#7be0b8" font-size="20">Cascades on</text><text x="470" y="706" class="v" fill="#7be0b8" font-size="20">sign-off</text><line x1="60" y1="740" x2="600" y2="740" stroke="#3a5f84" stroke-width="1" stroke-dasharray="5 4"/><text x="330" y="764" class="i" fill="#9fb8cf" font-size="16">Nothing here asks a clinician to enter something they</text><text x="330" y="783" class="i" fill="#9fb8cf" font-size="16">do not already enter.</text></g></svg>