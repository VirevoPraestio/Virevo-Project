<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 528" font-family="Poppins,'Segoe UI',Verdana,sans-serif"><style>text{text-anchor:middle}.t{font-weight:600}.v{font-weight:700}.c{font-weight:400}.i{font-weight:400;font-style:italic}.g{font-weight:700;text-anchor:end}.h{font-weight:700;text-anchor:start}.s{font-weight:400;text-anchor:start}.f{font-weight:400;text-anchor:start}</style><rect width="880" height="528" fill="#f1f5f9"/><text x="40" y="64" class="h" fill="#0f2740" font-size="30">Your Four Timestamps</text><text x="40" y="90" class="s" fill="#4d6076" font-size="18">Fill these in and the rest of the arithmetic follows</text><text x="40" y="500" class="f" fill="#71839a" font-size="12">tpl · fill-in-the-blank · v2</text><g transform="translate(0 97)"><rect x="40" y="112" width="179" height="115" rx="8" fill="#ffffff" stroke="#b0c0d1" stroke-width="1.2"/><text x="130" y="139" class="t" fill="#0f2740" font-size="17">Doctor's round</text><text x="130" y="169" class="v" fill="#0c6b4f" font-size="17">09:30</text><text x="130" y="194" class="c" fill="#4d6076" font-size="14">When is the</text><text x="130" y="213" class="c" fill="#4d6076" font-size="14">decision taken?</text><path d="M225 170H234" stroke="#0c6b4f" stroke-width="1.6" fill="none"/><path d="M241 170l-7 -4v9z" fill="#0c6b4f"/><rect x="247" y="112" width="179" height="115" rx="8" fill="#ffffff" stroke="#b0c0d1" stroke-width="1.2"/><text x="336" y="139" class="t" fill="#0f2740" font-size="17">Summary signed</text><text x="336" y="169" class="v" fill="#0c6b4f" font-size="17">12:15</text><text x="336" y="194" class="c" fill="#4d6076" font-size="14">When is it</text><text x="336" y="213" class="c" fill="#4d6076" font-size="14">actually signed?</text><path d="M432 170H441" stroke="#0c6b4f" stroke-width="1.6" fill="none"/><path d="M448 170l-7 -4v9z" fill="#0c6b4f"/><rect x="454" y="112" width="179" height="115" rx="8" fill="#ffffff" stroke="#b0c0d1" stroke-width="1.2"/><text x="544" y="139" class="t" fill="#0f2740" font-size="17">Billing cleared</text><text x="544" y="169" class="v" fill="#0c6b4f" font-size="17">14:40</text><text x="544" y="194" class="c" fill="#4d6076" font-size="14">When does the bill</text><text x="544" y="213" class="c" fill="#4d6076" font-size="14">close?</text><path d="M639 170H648" stroke="#0c6b4f" stroke-width="1.6" fill="none"/><path d="M655 170l-7 -4v9z" fill="#0c6b4f"/><rect x="661" y="112" width="179" height="115" rx="8" fill="#ffffff" stroke="#b0c0d1" stroke-width="1.2"/><text x="750" y="139" class="t" fill="#0f2740" font-size="17">Patient leaves</text><text x="750" y="169" class="v" fill="#0c6b4f" font-size="17">16:45</text><text x="750" y="194" class="c" fill="#4d6076" font-size="14">When is the bed</text><text x="750" y="213" class="c" fill="#4d6076" font-size="14">physically free?</text><line x1="40" y1="245" x2="840" y2="245" stroke="#a6b8cb" stroke-width="1" stroke-dasharray="5 4"/><text x="440" y="267" class="i" fill="#4d6076" font-size="14">Approximate is fine. A typical weekday, not the best one.</text></g></svg>