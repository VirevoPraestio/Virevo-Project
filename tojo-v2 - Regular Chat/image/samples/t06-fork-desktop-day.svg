<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 528" font-family="Poppins,'Segoe UI',Verdana,sans-serif"><style>text{text-anchor:middle}.t{font-weight:600}.v{font-weight:700}.c{font-weight:400}.i{font-weight:400;font-style:italic}.g{font-weight:700;text-anchor:end}.h{font-weight:700;text-anchor:start}.s{font-weight:400;text-anchor:start}.f{font-weight:400;text-anchor:start}</style><rect width="880" height="528" fill="#f1f5f9"/><text x="40" y="64" class="h" fill="#0f2740" font-size="30">Which Pattern Is Yours?</text><text x="40" y="90" class="s" fill="#4d6076" font-size="18">Both are common; neither is the wrong answer</text><text x="40" y="500" class="f" fill="#71839a" font-size="12">tpl · fork · v2</text><g transform="translate(0 44)"><rect x="200" y="112" width="480" height="72" rx="8" fill="#ffffff" stroke="#b0c0d1" stroke-width="1.2"/><text x="440" y="139" class="t" fill="#0f2740" font-size="17">When is the discharge summary written?</text><text x="440" y="169" class="v" fill="#0c6b4f" font-size="17">Pick the one that matches the floor</text><path d="M440 188V201" stroke="#0c6b4f" stroke-width="1.6" fill="none"/><path d="M440 208l-4 -7h9z" fill="#0c6b4f"/><path d="M166 206H714" stroke="#0c6b4f" stroke-width="1.6" fill="none"/><path d="M166 206V225" stroke="#0c6b4f" stroke-width="1.6" fill="none"/><path d="M166 232l-4 -7h9z" fill="#0c6b4f"/><path d="M440 206V225" stroke="#0c6b4f" stroke-width="1.6" fill="none"/><path d="M440 232l-4 -7h9z" fill="#0c6b4f"/><path d="M714 206V225" stroke="#0c6b4f" stroke-width="1.6" fill="none"/><path d="M714 232l-4 -7h9z" fill="#0c6b4f"/><rect x="40" y="236" width="252" height="143" rx="8" fill="#ffffff" stroke="#b0c0d1" stroke-width="1.2"/><text x="166" y="263" class="t" fill="#0f2740" font-size="17">After the morning</text><text x="166" y="286" class="t" fill="#0f2740" font-size="17">round</text><text x="166" y="316" class="v" fill="#0c6b4f" font-size="17">Doctor writes it that</text><text x="166" y="340" class="v" fill="#0c6b4f" font-size="17">day</text><text x="166" y="365" class="c" fill="#4d6076" font-size="14">Most common</text><rect x="314" y="236" width="252" height="143" rx="8" fill="#ffffff" stroke="#b0c0d1" stroke-width="1.2"/><text x="440" y="274" class="t" fill="#0f2740" font-size="17">The evening before</text><text x="440" y="304" class="v" fill="#0c6b4f" font-size="17">Drafted, signed next</text><text x="440" y="328" class="v" fill="#0c6b4f" font-size="17">morning</text><text x="440" y="354" class="c" fill="#4d6076" font-size="14">Less common</text><rect x="588" y="236" width="252" height="143" rx="8" fill="#ffffff" stroke="#b0c0d1" stroke-width="1.2"/><text x="714" y="275" class="t" fill="#0f2740" font-size="17">It varies by</text><text x="714" y="298" class="t" fill="#0f2740" font-size="17">consultant</text><text x="714" y="328" class="v" fill="#0c6b4f" font-size="17">No single practice</text><text x="714" y="353" class="c" fill="#4d6076" font-size="14">Worth saying if true</text></g></svg>