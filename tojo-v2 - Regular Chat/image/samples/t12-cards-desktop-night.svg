<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 528" font-family="Poppins,'Segoe UI',Verdana,sans-serif"><style>text{text-anchor:middle}.t{font-weight:600}.v{font-weight:700}.c{font-weight:400}.i{font-weight:400;font-style:italic}.g{font-weight:700;text-anchor:end}.h{font-weight:700;text-anchor:start}.s{font-weight:400;text-anchor:start}.f{font-weight:400;text-anchor:start}</style><rect width="880" height="528" fill="#0f2740"/><text x="40" y="64" class="h" fill="#ffffff" font-size="30">What Nothing Currently Tracks</text><text x="40" y="90" class="s" fill="#9fb8cf" font-size="18">Three gaps, in the order they block things</text><text x="40" y="500" class="f" fill="#6d88a3" font-size="12">tpl · cards · v2</text><g transform="translate(0 49)"><rect x="40" y="112" width="252" height="138" rx="8" fill="#1c3f61" stroke="#ffb400" stroke-width="2"/><text x="166" y="160" class="t" fill="#eaf1f8" font-size="17">Summary start time</text><text x="166" y="190" class="v" fill="#7be0b8" font-size="17">Not recorded anywhere</text><text x="166" y="215" class="c" fill="#9fb8cf" font-size="14">Blocks the whole derivation</text><rect x="314" y="112" width="252" height="138" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="440" y="150" class="t" fill="#eaf1f8" font-size="17">Bed-ready timestamp</text><text x="440" y="180" class="v" fill="#7be0b8" font-size="17">Recorded, not reliable</text><text x="440" y="206" class="c" fill="#9fb8cf" font-size="14">Entered in a batch at shift</text><text x="440" y="224" class="c" fill="#9fb8cf" font-size="14">end</text><rect x="588" y="112" width="252" height="138" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="714" y="139" class="t" fill="#eaf1f8" font-size="17">Admission wait at</text><text x="714" y="162" class="t" fill="#eaf1f8" font-size="17">14:00</text><text x="714" y="192" class="v" fill="#7be0b8" font-size="17">Not recorded</text><text x="714" y="217" class="c" fill="#9fb8cf" font-size="14">Decides whether freed time</text><text x="714" y="236" class="c" fill="#9fb8cf" font-size="14">is capturable</text><rect x="40" y="272" width="800" height="96" rx="8" fill="#d9dde3" stroke="#aab2bc" stroke-width="1.2"/><text x="440" y="299" class="t" fill="#0f2740" font-size="17">Measurable from day one</text><text x="440" y="329" class="v" fill="#7a4f00" font-size="17">Two of three</text><text x="440" y="354" class="c" fill="#43505e" font-size="14">The third needs one field added</text></g></svg>