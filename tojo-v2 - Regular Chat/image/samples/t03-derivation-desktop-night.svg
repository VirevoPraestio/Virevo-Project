<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 528" font-family="Poppins,'Segoe UI',Verdana,sans-serif"><style>text{text-anchor:middle}.t{font-weight:600}.v{font-weight:700}.c{font-weight:400}.i{font-weight:400;font-style:italic}.g{font-weight:700;text-anchor:end}.h{font-weight:700;text-anchor:start}.s{font-weight:400;text-anchor:start}.f{font-weight:400;text-anchor:start}</style><rect width="880" height="528" fill="#0f2740"/><text x="40" y="64" class="h" fill="#ffffff" font-size="30">What the Delay Costs</text><text x="40" y="90" class="s" fill="#9fb8cf" font-size="18">Working shown; conservative basis where your figures disagree</text><text x="40" y="500" class="f" fill="#6d88a3" font-size="12">tpl · derivation-chain · v2</text><g transform="translate(0 28)"><rect x="40" y="112" width="180" height="120" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="130" y="139" class="t" fill="#eaf1f8" font-size="17">Dead bed time</text><text x="130" y="169" class="v" fill="#7be0b8" font-size="17">5h 15m each</text><text x="130" y="193" class="v" fill="#7be0b8" font-size="17">3.7</text><text x="130" y="217" class="v" fill="#7be0b8" font-size="17">bed-days/day</text><path d="M226 172H234" stroke="#7be0b8" stroke-width="1.6" fill="none"/><path d="M240 172l-7 -4v9z" fill="#7be0b8"/><rect x="246" y="112" width="180" height="120" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="337" y="139" class="t" fill="#eaf1f8" font-size="17">Your volume</text><text x="337" y="169" class="v" fill="#7be0b8" font-size="17">42</text><text x="337" y="193" class="v" fill="#7be0b8" font-size="17">discharges/day</text><text x="337" y="217" class="v" fill="#7be0b8" font-size="17">220 bed-days/mo</text><path d="M433 172H440" stroke="#7be0b8" stroke-width="1.6" fill="none"/><path d="M447 172l-7 -4v9z" fill="#7be0b8"/><rect x="453" y="112" width="180" height="120" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="543" y="140" class="t" fill="#eaf1f8" font-size="17">At your</text><text x="543" y="162" class="t" fill="#eaf1f8" font-size="17">occupancy</text><text x="543" y="192" class="v" fill="#7be0b8" font-size="17">78% occupied</text><text x="543" y="216" class="v" fill="#7be0b8" font-size="17">172 billable</text><path d="M640 172H646" stroke="#7be0b8" stroke-width="1.6" fill="none"/><path d="M654 172l-7 -4v9z" fill="#7be0b8"/><rect x="660" y="112" width="180" height="120" rx="8" fill="#1c3f61" stroke="#ff8b82" stroke-width="2"/><text x="750" y="152" class="t" fill="#eaf1f8" font-size="17">Revenue not</text><text x="750" y="174" class="t" fill="#eaf1f8" font-size="17">billed</text><text x="750" y="204" class="v" fill="#ff8b82" font-size="17">Rs. 2.7 Cr/yr</text><line x1="40" y1="250" x2="840" y2="250" stroke="#3a5f84" stroke-width="1" stroke-dasharray="5 4"/><text x="440" y="272" class="i" fill="#9fb8cf" font-size="14">Holds only while admissions demand exceeds free beds in the same window. Your two occupancy</text><text x="440" y="289" class="i" fill="#9fb8cf" font-size="14">figures disagree; this takes the lower, so it understates.</text><rect x="40" y="314" width="390" height="96" rx="8" fill="#d9dde3" stroke="#aab2bc" stroke-width="1.2"/><text x="235" y="341" class="t" fill="#0f2740" font-size="17">ALOS</text><text x="235" y="371" class="v" fill="#7a4f00" font-size="17">-0.4 days</text><text x="235" y="396" class="c" fill="#43505e" font-size="14">Derived, not measured</text><rect x="450" y="314" width="390" height="96" rx="8" fill="#d9dde3" stroke="#aab2bc" stroke-width="1.2"/><text x="645" y="341" class="t" fill="#0f2740" font-size="17">Occupancy headroom</text><text x="645" y="371" class="v" fill="#7a4f00" font-size="17">+6 pts</text><text x="645" y="396" class="c" fill="#43505e" font-size="14">Same effect, counted above</text></g></svg>