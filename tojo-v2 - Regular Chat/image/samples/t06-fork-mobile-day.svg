<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 880" font-family="Poppins,'Segoe UI',Verdana,sans-serif"><style>text{text-anchor:middle}.t{font-weight:600}.v{font-weight:700}.c{font-weight:400}.i{font-weight:400;font-style:italic}.g{font-weight:700;text-anchor:end}.h{font-weight:700;text-anchor:start}.s{font-weight:400;text-anchor:start}.f{font-weight:400;text-anchor:start}</style><rect width="660" height="880" fill="#f1f5f9"/><text x="60" y="89" class="h" fill="#0f2740" font-size="35">Which Pattern Is Yours?</text><text x="60" y="118" class="s" fill="#4d6076" font-size="21">Both are common; neither is the wrong</text><text x="60" y="142" class="s" fill="#4d6076" font-size="21">answer</text><text x="60" y="834" class="f" fill="#71839a" font-size="14">tpl · fork · v2</text><g transform="translate(0 74)"><rect x="60" y="164" width="540" height="80" rx="8" fill="#ffffff" stroke="#b0c0d1" stroke-width="1.2"/><text x="330" y="194" class="t" fill="#0f2740" font-size="20">When is the discharge summary written?</text><text x="330" y="228" class="v" fill="#0c6b4f" font-size="20">Pick the one that matches the floor</text><rect x="60" y="258" width="540" height="106" rx="8" fill="#ffffff" stroke="#b0c0d1" stroke-width="1.2"/><text x="330" y="288" class="t" fill="#0f2740" font-size="20">After the morning round</text><text x="330" y="322" class="v" fill="#0c6b4f" font-size="20">Doctor writes it that day</text><text x="330" y="350" class="c" fill="#4d6076" font-size="16">Most common</text><text x="330" y="390" class="i" fill="#4d6076" font-size="16">or</text><rect x="60" y="400" width="540" height="106" rx="8" fill="#ffffff" stroke="#b0c0d1" stroke-width="1.2"/><text x="330" y="430" class="t" fill="#0f2740" font-size="20">The evening before</text><text x="330" y="464" class="v" fill="#0c6b4f" font-size="20">Drafted, signed next morning</text><text x="330" y="492" class="c" fill="#4d6076" font-size="16">Less common</text><text x="330" y="532" class="i" fill="#4d6076" font-size="16">or</text><rect x="60" y="542" width="540" height="106" rx="8" fill="#ffffff" stroke="#b0c0d1" stroke-width="1.2"/><text x="330" y="572" class="t" fill="#0f2740" font-size="20">It varies by consultant</text><text x="330" y="606" class="v" fill="#0c6b4f" font-size="20">No single practice</text><text x="330" y="634" class="c" fill="#4d6076" font-size="16">Worth saying if true</text></g></svg>