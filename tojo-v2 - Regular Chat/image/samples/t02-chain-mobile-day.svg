<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 933" font-family="Poppins,'Segoe UI',Verdana,sans-serif"><style>text{text-anchor:middle}.t{font-weight:600}.v{font-weight:700}.c{font-weight:400}.i{font-weight:400;font-style:italic}.g{font-weight:700;text-anchor:end}.h{font-weight:700;text-anchor:start}.s{font-weight:400;text-anchor:start}.f{font-weight:400;text-anchor:start}</style><rect width="700" height="933" fill="#f1f5f9"/><text x="60" y="87" class="h" fill="#0f2740" font-size="33">Where the Discharge Day</text><text x="60" y="124" class="h" fill="#0f2740" font-size="33">Actually Goes</text><text x="60" y="152" class="s" fill="#4d6076" font-size="20">Your own timestamps, one weekday</text><text x="60" y="887" class="f" fill="#71839a" font-size="14">tpl · chain · v2</text><rect x="60" y="174" width="580" height="76" rx="8" fill="#ffffff" stroke="#b0c0d1" stroke-width="1.2"/><text x="350" y="203" class="t" fill="#0f2740" font-size="19">Doctor's round</text><text x="350" y="235" class="v" fill="#0c6b4f" font-size="19">~09:30</text><path d="M350 255V266" stroke="#0c6b4f" stroke-width="1.6" fill="none"/><path d="M350 273l-4 -7h9z" fill="#0c6b4f"/><rect x="60" y="276" width="580" height="76" rx="8" fill="#ffffff" stroke="#9a6205" stroke-width="2"/><text x="285" y="305" class="t" fill="#0f2740" font-size="19">Summary drafted</text><text x="350" y="337" class="v" fill="#0c6b4f" font-size="19">~12:15</text><text x="632" y="302" class="g" fill="#9a6205" font-size="16">BIGGEST LEAK</text><path d="M350 357V368" stroke="#0c6b4f" stroke-width="1.6" fill="none"/><path d="M350 375l-4 -7h9z" fill="#0c6b4f"/><rect x="60" y="378" width="580" height="76" rx="8" fill="#ffffff" stroke="#b0c0d1" stroke-width="1.2"/><text x="350" y="407" class="t" fill="#0f2740" font-size="19">Billing cleared</text><text x="350" y="439" class="v" fill="#0c6b4f" font-size="19">~14:40</text><path d="M350 459V470" stroke="#0c6b4f" stroke-width="1.6" fill="none"/><path d="M350 477l-4 -7h9z" fill="#0c6b4f"/><rect x="60" y="480" width="580" height="76" rx="8" fill="#ffffff" stroke="#b0c0d1" stroke-width="1.2"/><text x="350" y="509" class="t" fill="#0f2740" font-size="19">Pharmacy return</text><text x="350" y="541" class="v" fill="#0c6b4f" font-size="19">~15:50</text><path d="M350 561V572" stroke="#0c6b4f" stroke-width="1.6" fill="none"/><path d="M350 579l-4 -7h9z" fill="#0c6b4f"/><rect x="60" y="582" width="580" height="76" rx="8" fill="#ffffff" stroke="#b7352b" stroke-width="2"/><text x="350" y="611" class="t" fill="#0f2740" font-size="19">Bed free</text><text x="350" y="643" class="v" fill="#b7352b" font-size="19">~16:45</text><line x1="60" y1="676" x2="640" y2="676" stroke="#a6b8cb" stroke-width="1" stroke-dasharray="5 4"/><text x="350" y="700" class="i" fill="#4d6076" font-size="16">The 18:00-22:00 window is already staffed and carries none</text><text x="350" y="719" class="i" fill="#4d6076" font-size="16">of this.</text><rect x="60" y="746" width="280" height="102" rx="8" fill="#0f2740" stroke="#2c5580" stroke-width="1.2"/><text x="200" y="775" class="t" fill="#b9cee0" font-size="19">Dead bed time</text><text x="200" y="807" class="v" fill="#f0b74a" font-size="19">5h 15m</text><text x="200" y="834" class="c" fill="#9fb8cf" font-size="16">Per discharge, derived</text><rect x="360" y="746" width="280" height="102" rx="8" fill="#0f2740" stroke="#2c5580" stroke-width="1.2"/><text x="500" y="775" class="t" fill="#b9cee0" font-size="19">Beds lost</text><text x="500" y="807" class="v" fill="#f0b74a" font-size="19">~8 bed-days</text><text x="500" y="834" class="c" fill="#9fb8cf" font-size="16">Per day</text></svg>