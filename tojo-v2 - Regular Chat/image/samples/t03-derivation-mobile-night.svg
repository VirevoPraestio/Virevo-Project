<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 880" font-family="Poppins,'Segoe UI',Verdana,sans-serif"><style>text{text-anchor:middle}.t{font-weight:600}.v{font-weight:700}.c{font-weight:400}.i{font-weight:400;font-style:italic}.g{font-weight:700;text-anchor:end}.h{font-weight:700;text-anchor:start}.s{font-weight:400;text-anchor:start}.f{font-weight:400;text-anchor:start}</style><rect width="660" height="880" fill="#0f2740"/><text x="60" y="84" class="h" fill="#ffffff" font-size="30">What the Delay Costs</text><text x="60" y="110" class="s" fill="#9fb8cf" font-size="18">Working shown; conservative basis where your</text><text x="60" y="131" class="s" fill="#9fb8cf" font-size="18">figures disagree</text><text x="60" y="832" class="f" fill="#6d88a3" font-size="12">tpl · derivation-chain · v2</text><g transform="translate(0 6)"><rect x="60" y="153" width="540" height="96" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="330" y="180" class="t" fill="#eaf1f8" font-size="17">Dead bed time</text><text x="330" y="210" class="v" fill="#7be0b8" font-size="17">5h 15m each</text><text x="330" y="234" class="v" fill="#7be0b8" font-size="17">3.7 bed-days/day</text><path d="M330 254V265" stroke="#7be0b8" stroke-width="1.6" fill="none"/><path d="M330 272l-4 -7h9z" fill="#7be0b8"/><rect x="60" y="275" width="540" height="96" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="330" y="302" class="t" fill="#eaf1f8" font-size="17">Your volume</text><text x="330" y="332" class="v" fill="#7be0b8" font-size="17">42 discharges/day</text><text x="330" y="356" class="v" fill="#7be0b8" font-size="17">220 bed-days/mo</text><path d="M330 376V387" stroke="#7be0b8" stroke-width="1.6" fill="none"/><path d="M330 394l-4 -7h9z" fill="#7be0b8"/><rect x="60" y="397" width="540" height="96" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="330" y="424" class="t" fill="#eaf1f8" font-size="17">At your occupancy</text><text x="330" y="454" class="v" fill="#7be0b8" font-size="17">78% occupied</text><text x="330" y="478" class="v" fill="#7be0b8" font-size="17">172 billable</text><path d="M330 498V509" stroke="#7be0b8" stroke-width="1.6" fill="none"/><path d="M330 516l-4 -7h9z" fill="#7be0b8"/><rect x="60" y="519" width="540" height="72" rx="8" fill="#1c3f61" stroke="#ff8b82" stroke-width="2"/><text x="330" y="546" class="t" fill="#eaf1f8" font-size="17">Revenue not billed</text><text x="330" y="576" class="v" fill="#ff8b82" font-size="17">Rs. 2.7 Cr/yr</text><line x1="60" y1="609" x2="600" y2="609" stroke="#3a5f84" stroke-width="1" stroke-dasharray="5 4"/><text x="330" y="631" class="i" fill="#9fb8cf" font-size="14">Holds only while admissions demand exceeds free beds in the</text><text x="330" y="648" class="i" fill="#9fb8cf" font-size="14">same window. Your two occupancy figures disagree; this takes</text><text x="330" y="665" class="i" fill="#9fb8cf" font-size="14">the lower, so it understates.</text><rect x="60" y="690" width="260" height="96" rx="8" fill="#d9dde3" stroke="#aab2bc" stroke-width="1.2"/><text x="190" y="717" class="t" fill="#0f2740" font-size="17">ALOS</text><text x="190" y="747" class="v" fill="#7a4f00" font-size="17">-0.4 days</text><text x="190" y="772" class="c" fill="#43505e" font-size="14">Derived, not measured</text><rect x="340" y="690" width="260" height="96" rx="8" fill="#d9dde3" stroke="#aab2bc" stroke-width="1.2"/><text x="470" y="717" class="t" fill="#0f2740" font-size="17">Occupancy headroom</text><text x="470" y="747" class="v" fill="#7a4f00" font-size="17">+6 pts</text><text x="470" y="772" class="c" fill="#43505e" font-size="14">Same effect, counted above</text></g></svg>