<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 528" font-family="Poppins,'Segoe UI',Verdana,sans-serif"><style>text{text-anchor:middle}.t{font-weight:600}.v{font-weight:700}.c{font-weight:400}.i{font-weight:400;font-style:italic}.g{font-weight:700;text-anchor:end}.h{font-weight:700;text-anchor:start}.s{font-weight:400;text-anchor:start}.f{font-weight:400;text-anchor:start}</style><rect width="880" height="528" fill="#0f2740"/><text x="40" y="64" class="h" fill="#ffffff" font-size="30">What We Would Need to Establish</text><text x="40" y="90" class="s" fill="#9fb8cf" font-size="18">Four areas, one at a time</text><text x="40" y="500" class="f" fill="#6d88a3" font-size="12">tpl · agenda-grid · v2</text><g transform="translate(0 72)"><rect x="40" y="112" width="389" height="72" rx="8" fill="#1c3f61" stroke="#7be0b8" stroke-width="2"/><text x="186" y="139" class="t" fill="#eaf1f8" font-size="17">Discharge timings</text><text x="234" y="169" class="v" fill="#7be0b8" font-size="17">How long does it really take?</text><text x="421" y="136" class="g" fill="#7be0b8" font-size="14">START HERE</text><rect x="451" y="112" width="389" height="72" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="646" y="139" class="t" fill="#eaf1f8" font-size="17">Bed allocation record</text><text x="646" y="169" class="v" fill="#7be0b8" font-size="17">Do the timings check out?</text><rect x="40" y="206" width="389" height="72" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="234" y="233" class="t" fill="#eaf1f8" font-size="17">Evening staffing</text><text x="234" y="263" class="v" fill="#7be0b8" font-size="17">Who is already on shift?</text><rect x="451" y="206" width="389" height="72" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="646" y="233" class="t" fill="#eaf1f8" font-size="17">Admission demand</text><text x="646" y="263" class="v" fill="#7be0b8" font-size="17">Is the freed time capturable?</text><line x1="40" y1="296" x2="840" y2="296" stroke="#3a5f84" stroke-width="1" stroke-dasharray="5 4"/><text x="440" y="318" class="i" fill="#9fb8cf" font-size="14">Not in order; take whichever you have numbers for first.</text></g></svg>