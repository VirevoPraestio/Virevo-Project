<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 880" font-family="Poppins,'Segoe UI',Verdana,sans-serif"><style>text{text-anchor:middle}.t{font-weight:600}.v{font-weight:700}.c{font-weight:400}.i{font-weight:400;font-style:italic}.g{font-weight:700;text-anchor:end}.h{font-weight:700;text-anchor:start}.s{font-weight:400;text-anchor:start}.f{font-weight:400;text-anchor:start}</style><rect width="660" height="880" fill="#f1f5f9"/><text x="60" y="89" class="h" fill="#0f2740" font-size="35">Who Has to Cooperate</text><text x="60" y="118" class="s" fill="#4d6076" font-size="21">And what each is actually being asked for</text><text x="60" y="834" class="f" fill="#71839a" font-size="14">tpl · role-cards · v2</text><g transform="translate(0 65)"><rect x="60" y="140" width="260" height="181" rx="8" fill="#ffffff" stroke="#b0c0d1" stroke-width="1.2"/><text x="190" y="208" class="t" fill="#0f2740" font-size="20">Ward nurses</text><text x="190" y="242" class="v" fill="#0c6b4f" font-size="20">No extra time</text><text x="190" y="270" class="c" fill="#4d6076" font-size="16">Confirm, not produce</text><rect x="340" y="140" width="260" height="181" rx="8" fill="#ffffff" stroke="#9a6205" stroke-width="2"/><text x="470" y="166" class="v" fill="#9a6205" font-size="16">MOST TO LOSE</text><text x="470" y="196" class="t" fill="#0f2740" font-size="20">Consultants</text><text x="470" y="230" class="v" fill="#0c6b4f" font-size="20">Sign a draft, not</text><text x="470" y="258" class="v" fill="#0c6b4f" font-size="20">write one</text><text x="470" y="286" class="c" fill="#4d6076" font-size="16">Gives up the 'my own</text><text x="470" y="307" class="c" fill="#4d6076" font-size="16">words' summary</text><rect x="60" y="341" width="260" height="127" rx="8" fill="#ffffff" stroke="#b0c0d1" stroke-width="1.2"/><text x="190" y="371" class="t" fill="#0f2740" font-size="20">Billing desk</text><text x="190" y="405" class="v" fill="#0c6b4f" font-size="20">Work from a cascade</text><text x="190" y="433" class="c" fill="#4d6076" font-size="16">Starts earlier, same</text><text x="190" y="454" class="c" fill="#4d6076" font-size="16">work</text><rect x="60" y="494" width="540" height="106" rx="8" fill="#ffffff" stroke="#0c6b4f" stroke-width="2"/><text x="285" y="524" class="t" fill="#0f2740" font-size="20">Medical Superintendent</text><text x="330" y="558" class="v" fill="#0c6b4f" font-size="20">Approves the sign-off change</text><text x="330" y="586" class="c" fill="#4d6076" font-size="16">Outside the daily routine — easy to leave out</text><text x="592" y="520" class="g" fill="#0c6b4f" font-size="16">APPROVES</text><line x1="60" y1="618" x2="600" y2="618" stroke="#a6b8cb" stroke-width="1" stroke-dasharray="5 4"/><text x="330" y="642" class="i" fill="#4d6076" font-size="16">Without this approval the draft is written and never</text><text x="330" y="661" class="i" fill="#4d6076" font-size="16">signed, and the evening work is wasted.</text></g></svg>