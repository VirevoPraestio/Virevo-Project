480" y="204" class="v" fill="#0c6b4f" font-size="17">~14:40</text><path d="M562 172H573" stroke="#0c6b4f" stroke-width="1.6" fill="none"/><path d="M580 172l-7 -4v9z" fill="#0c6b4f"/><rect x="586" y="112" width="152" height="119" rx="8" fill="#ffffff" stroke="#b0c0d1" stroke-width="1.2"/><text x="662" y="151" class="t" fill="#0f2740" font-size="17">Pharmacy</text><text x="662" y="174" class="t" fill="#0f2740" font-size="17">return</text><text x="662" y="204" class="v" fill="#0c6b4f" font-size="17">~15:50</text><path d="M744 172H755" stroke="#0c6b4f" stroke-width="1.6" fill="none"/><path d="M762 172l-7 -4v9z" fill="#0c6b4f"/><rect x="768" y="112" width="152" height="119" rx="8" fill="#ffffff" stroke="#b7352b" stroke-width="2"/><text x="844" y="162" class="t" fill="#0f2740" font-size="17">Bed free</text><text x="844" y="192" class="v" fill="#b7352b" font-size="17">~16:45</text><line x1="40" y1="249" x2="920" y2="249" stroke="#a6b8cb" stroke-width="1" stroke-dasharray="5 4"/><text x="480" y="271" class="i" fill="#4d6076" font-size="14">The 18:00-22:00 window is already staffed and carries none of this.</text><rect x="40" y="298" width="430" height="96" rx="8" fill="#0f2740" stroke="#2c5580" stroke-width="1.2"/><text x="255" y="325" class="t" fill="#b9cee0" font-size="17">Dead bed time</text><text x="255" y="355" class="v" fill="#f0b74a" font-size="17">5h 15m</text><text x="255" y="380" class="c" fill="#9fb8cf" font-size="14">Per discharge, derived</text><rect x="490" y="298" width="430" height="96" rx="8" fill="#0f2740" stroke="#2c5580" stroke-width="1.2"/><text x="705" y="325" class="t" fill="#b9cee0" font-size="17">Beds lost</text><text x="705" y="355" class="v" fill="#f0b74a" font-size="17">~8 bed-days</text><text x="705" y="380" class="c" fill="#9fb8cf" font-size="14">Per day</text></g></svg>