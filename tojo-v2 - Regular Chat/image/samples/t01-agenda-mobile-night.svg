<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 880" font-family="Poppins,'Segoe UI',Verdana,sans-serif"><style>text{text-anchor:middle}.t{font-weight:600}.v{font-weight:700}.c{font-weight:400}.i{font-weight:400;font-style:italic}.g{font-weight:700;text-anchor:end}.h{font-weight:700;text-anchor:start}.s{font-weight:400;text-anchor:start}.f{font-weight:400;text-anchor:start}</style><rect width="660" height="880" fill="#0f2740"/><text x="60" y="89" class="h" fill="#ffffff" font-size="35">What We Would Need to</text><text x="60" y="128" class="h" fill="#ffffff" font-size="35">Establish</text><text x="60" y="157" class="s" fill="#9fb8cf" font-size="21">Four areas, one at a time</text><text x="60" y="834" class="f" fill="#6d88a3" font-size="14">tpl · agenda-grid · v2</text><g transform="translate(0 143)"><rect x="60" y="179" width="259" height="135" rx="8" fill="#1c3f61" stroke="#7be0b8" stroke-width="2"/><text x="190" y="206" class="v" fill="#7be0b8" font-size="16">START HERE</text><text x="190" y="236" class="t" fill="#eaf1f8" font-size="20">Discharge timings</text><text x="190" y="270" class="v" fill="#7be0b8" font-size="20">How long does it</text><text x="190" y="298" class="v" fill="#7be0b8" font-size="20">really take?</text><rect x="341" y="179" width="259" height="135" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="470" y="209" class="t" fill="#eaf1f8" font-size="20">Bed allocation</text><text x="470" y="236" class="t" fill="#eaf1f8" font-size="20">record</text><text x="470" y="270" class="v" fill="#7be0b8" font-size="20">Do the timings</text><text x="470" y="298" class="v" fill="#7be0b8" font-size="20">check out?</text><rect x="60" y="336" width="259" height="108" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="190" y="366" class="t" fill="#eaf1f8" font-size="20">Evening staffing</text><text x="190" y="400" class="v" fill="#7be0b8" font-size="20">Who is already on</text><text x="190" y="428" class="v" fill="#7be0b8" font-size="20">shift?</text><rect x="341" y="336" width="259" height="108" rx="8" fill="#1c3f61" stroke="#2c5580" stroke-width="1.2"/><text x="470" y="366" class="t" fill="#eaf1f8" font-size="20">Admission demand</text><text x="470" y="400" class="v" fill="#7be0b8" font-size="20">Is the freed time</text><text x="470" y="428" class="v" fill="#7be0b8" font-size="20">capturable?</text><line x1="60" y1="462" x2="600" y2="462" stroke="#3a5f84" stroke-width="1" stroke-dasharray="5 4"/><text x="330" y="486" class="i" fill="#9fb8cf" font-size="16">Not in order; take whichever you have numbers for</text><text x="330" y="505" class="i" fill="#9fb8cf" font-size="16">first.</text></g></svg>