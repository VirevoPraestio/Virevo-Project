<title>Simulation Page Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@500;700&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Review page: a neutral strip on top, then one full-bleed option at a time.
   Each option commits to its own single look (no light/dark swap by design); every colour is set explicitly. */

/* Layout: a neutral review strip on top, then one full-bleed suite landing at a time.
   Each scheme commits to its own single look (no light/dark swap by design); every colour is set explicitly. */
:root{
  --f-num:"Bebas Neue","Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"Poppins","Segoe UI",system-ui,sans-serif;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --rv-bg:#F4F4F2; --rv-ink:#1D1F22; --rv-mute:#5E636A; --rv-line:#D9DADC;
  --forest:#10241a; --forest2:#17321f; --cream:#F3EFE3; --gold:#d4a94f;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--rv-bg);color:var(--rv-ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #F2B705;outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- review strip (not part of the design) ---------- */
.rv{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;border-bottom:1px solid var(--rv-line);background:var(--rv-bg)}
.rv h1{font-family:var(--f-num);font-weight:400;font-size:26px;letter-spacing:.02em;margin:0;line-height:1}
.rv small{display:block;color:var(--rv-mute);font-size:12px}
.rv .picks{display:flex;flex-wrap:wrap;gap:6px}
.rv .picks button{border:1.5px solid var(--rv-line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;min-height:40px}
.rv .picks button b{font-family:var(--f-num);font-weight:400;font-size:17px;margin-right:6px;letter-spacing:.03em}
.rv .picks button[aria-pressed="true"]{background:var(--rv-ink);color:#fff;border-color:var(--rv-ink)}
.rv .uni{margin-left:auto;border:1.5px dashed var(--rv-ink);background:transparent;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;min-height:40px}
.rv-note{padding:8px 16px;font-size:12.5px;color:var(--rv-mute);border-bottom:1px solid var(--rv-line);background:#fff}
.rv-note b{color:var(--rv-ink)}
#stage{transition:margin-right .3s ease;min-height:80vh}
body.chat-open #stage{margin-right:400px}
@media (max-width:900px){ body.chat-open #stage{margin-right:0} .rv .uni{margin-left:0} }

/* ---------- hover peek (universal) ---------- */
#peek{position:fixed;z-index:60;max-width:300px;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;
  background:var(--pk-bg,#111);color:var(--pk-fg,#fff);border:1px solid var(--pk-line,#333);border-radius:var(--pk-r,10px);padding:10px 12px;font-size:12.5px;line-height:1.45;box-shadow:0 12px 30px rgba(0,0,0,.25)}
#peek.on{opacity:1;transform:none;pointer-events:auto}
#peek{max-width:320px}
#peek .pk-bar{display:flex;gap:6px;align-items:center;margin:-2px -4px 8px;padding-bottom:8px;border-bottom:1px solid var(--pk-line)}
.pk-ask{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--gold);background:var(--forest);color:var(--cream);border-radius:999px;padding:4px 12px 4px 4px;font-size:12px;font-weight:600;min-height:34px}
.pk-ask i{width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--forest);display:grid;place-items:center;font-style:normal;font-family:var(--f-num);font-size:15px}
.pk-x{margin-left:auto;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--pk-line);background:transparent;color:inherit;font-size:17px;line-height:1}
#peek .pk-t{font-weight:600;font-size:13px;margin-bottom:2px}
#peek .pk-n{font-family:var(--f-num);font-size:26px;line-height:1;letter-spacing:.02em}
#peek .pk-m{opacity:.78}
#peek .pk-hint{margin-top:6px;font-size:11px;opacity:.6}

/* ---------- detail sheet (expanded item) ---------- */
#scrim{position:fixed;inset:0;background:rgba(10,12,14,.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;z-index:71;left:50%;bottom:0;transform:translate(-50%,105%);width:min(780px,100%);max-height:86vh;overflow:auto;
  background:var(--sh-bg,#fff);color:var(--sh-fg,#111);border-radius:var(--sh-r,18px) var(--sh-r,18px) 0 0;padding:22px 22px calc(26px + env(safe-area-inset-bottom,0px));
  transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;visibility:hidden;border:1px solid var(--sh-line,#ddd);border-bottom:0;font-family:var(--f-body)}
#sheet.on{transform:translate(-50%,0);visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sheet .shbar{position:sticky;top:-22px;z-index:2;display:flex;justify-content:flex-end;gap:10px;margin:-22px -22px 6px;padding:12px 16px;background:var(--sh-bg);border-bottom:1px solid var(--sh-line)}
#sheet .x{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--sh-line);background:var(--sh-bg);color:var(--sh-fg);font-size:20px;line-height:1}
#sheet .sh-ask{display:inline-flex;align-items:center;gap:9px;border:2px solid var(--gold);background:var(--forest);color:var(--cream);border-radius:999px;padding:5px 16px 5px 5px;font-size:14px;font-weight:600;min-height:44px}
#sheet .sh-ask i{width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--forest);display:grid;place-items:center;font-style:normal;font-family:var(--f-num);font-size:20px}
body.chat-open #sheet{left:calc((100% - 400px)/2);width:min(780px,calc(100% - 420px))}
body.chat-open #chat{z-index:75}
body.chat-open #peek{z-index:80}
.d-eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--sh-mute)}
.d-title{font-family:var(--f-num);font-weight:400;font-size:38px;line-height:1;margin:4px 0 6px;letter-spacing:.01em;text-wrap:balance}
.d-sub{color:var(--sh-mute);margin:0 0 14px}
.d-pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;border:1.5px solid currentColor}
.d-pill.ahead{color:var(--c-ok)} .d-pill.watch{color:var(--c-warn)} .d-pill.off{color:var(--c-bad)}
.d-pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.d-four{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.d-four div{border:1px solid var(--sh-line);border-radius:10px;padding:10px;background:var(--sh-card)}
.d-four span{display:block;font-size:11.5px;color:var(--sh-mute);font-weight:600}
.d-four b{font-family:var(--f-num);font-weight:400;font-size:26px;line-height:1.1;letter-spacing:.02em}
.d-four .now b{color:var(--sh-state)}
.d-glide{position:relative;height:46px;margin:6px 4px 18px}
.d-glide .rail{position:absolute;left:0;right:0;top:20px;height:6px;border-radius:3px;background:var(--sh-line)}
.d-glide .fill{position:absolute;left:0;top:20px;height:6px;border-radius:3px;background:var(--sh-state)}
.d-glide .mk{position:absolute;top:8px;width:2px;height:30px;background:var(--sh-fg);transform:translateX(-1px)}
.d-glide .mk.plan{background:none;border-left:2px dashed var(--sh-mute)}
.d-glide .mk i{position:absolute;top:32px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;white-space:nowrap;color:var(--sh-mute)}
.d-sec{margin-top:16px}
.d-sec h4{margin:0 0 8px;font-size:13px;font-weight:600}
.d-fac{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:6px 12px;align-items:center;font-size:13.5px}
.d-fac .bar{display:block;height:8px;border-radius:4px;background:var(--sh-line);overflow:hidden}
.d-fac .bar i{display:block;height:100%;background:var(--c-bad)}
.d-fix{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.d-fix li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;border:1px solid var(--sh-line);border-radius:10px;padding:9px 10px;background:var(--sh-card);font-size:13.5px}
.d-fix .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--sh-fg);color:var(--sh-bg)}
.d-fix time{font-size:12px;font-weight:600;color:var(--sh-mute);white-space:nowrap}
.d-back{margin-top:12px;font-family:var(--f-hand);font-weight:700;font-size:24px;color:var(--sh-state)}
.d-list{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.d-list li{display:flex;gap:10px;align-items:baseline;font-size:13.5px}
.d-list .ck{flex:0 0 18px;height:18px;border-radius:5px;border:2px solid var(--sh-fg);display:grid;place-items:center;font-size:11px;font-weight:700}
.d-list .ck.y{background:var(--sh-fg);color:var(--sh-bg)}
.d-list .ck.late{border-color:var(--c-bad);color:var(--c-bad)}
.d-list em{font-style:normal;font-size:12px;font-weight:600;color:var(--sh-mute);margin-left:auto;white-space:nowrap}
.d-list em.late{color:var(--c-bad)}
.d-impact{border-left:4px solid var(--c-bad);padding:8px 12px;background:var(--sh-card);border-radius:0 10px 10px 0;font-size:13.5px}
.d-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.d-grid div{border:1px solid var(--sh-line);border-radius:10px;padding:10px;background:var(--sh-card)}
.d-grid span{font-size:11.5px;color:var(--sh-mute);font-weight:600;display:block}
.d-grid b{font-size:14px}
.d-money{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.d-money th,.d-money td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--sh-line)}
.d-money th:first-child,.d-money td:first-child{text-align:left}
.d-money tfoot td{font-weight:700}
.d-wrap{overflow-x:auto}
.d-uni{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.d-uni div{border:1px solid var(--sh-line);border-radius:12px;padding:12px;background:var(--sh-card)}
.d-uni b{display:block;font-size:14px;margin-bottom:3px}
.d-uni p{margin:0;font-size:13px;color:var(--sh-mute)}
@media (max-width:600px){ .d-four{grid-template-columns:repeat(2,1fr)} .d-fac{grid-template-columns:minmax(0,1fr) 72px} .d-title{font-size:32px} }

/* ---------- chat (same look as the tools) ---------- */
#chatFab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:10px;
  background:var(--forest);color:var(--cream);border:2px solid var(--gold);border-radius:999px;padding:8px 18px 8px 8px;min-height:56px;box-shadow:0 10px 24px rgba(0,0,0,.28)}
#chatFab .t{width:40px;height:40px;border-radius:50%;background:var(--gold);color:var(--forest);display:grid;place-items:center;font-family:var(--f-num);font-size:24px}
#chatFab span{font-weight:600;font-size:14px}
#chatFab .dot{position:absolute;top:6px;left:40px;width:12px;height:12px;border-radius:50%;background:#E5484D;border:2px solid var(--forest)}
body.chat-open #chatFab{display:none}
#chat{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:100%;z-index:55;background:var(--forest);color:var(--cream);transform:translateX(102%);transition:transform .3s ease;visibility:hidden;display:flex;flex-direction:column;border-radius:20px 0 0 20px}
body.chat-open #chat{transform:none;visibility:visible}
#chat header{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid rgba(243,239,227,.12)}
#chat header .t{width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--forest);display:grid;place-items:center;font-family:var(--f-num);font-size:26px}
#chat header h3{margin:0;font-family:var(--f-num);font-weight:400;font-size:26px;letter-spacing:.03em;line-height:1}
#chat header small{display:block;font-size:12px;opacity:.75}
#chat header button{margin-left:auto;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(243,239,227,.3);background:transparent;color:var(--cream);font-size:18px}
#chat .body{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
#chat .msg{background:var(--cream);color:var(--forest);border-radius:14px;padding:12px 14px;font-size:14px}
#chat .msg p{margin:0 0 8px} #chat .msg p:last-child{margin:0}
#chat .lbl{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;opacity:.75}
#chat .note{font-family:var(--f-hand);font-weight:700;font-size:31px;line-height:1.08;color:var(--gold)}
#chat .pt{display:flex;gap:10px;align-items:center;border:1px solid rgba(243,239,227,.22);border-radius:10px;padding:9px 10px;background:transparent;color:var(--cream);text-align:left;font-size:13.5px;min-height:44px}
#chat .pt b{border:1px solid rgba(243,239,227,.35);border-radius:6px;padding:2px 6px;font-size:11.5px}
#chat .pt[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
#chat .ask{border:1.5px dashed rgba(212,169,79,.7);border-radius:16px;padding:9px 14px;background:transparent;color:var(--cream);text-align:left;font-size:13.5px;display:flex;justify-content:space-between;gap:8px;min-height:44px}
#chat .ask::after{content:"→";color:var(--gold)}
#chat .ctx{margin:0 18px;padding:10px 12px;border:1.5px solid var(--gold);border-bottom:0;border-radius:12px 12px 0 0;background:rgba(212,169,79,.1);display:flex;gap:10px;align-items:flex-start}
#chat .ctx div{flex:1;min-width:0;font-size:12.5px}
#chat .ctx span{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600}
#chat .ctx b{display:block;font-size:13.5px}
#chat .ctx small{display:block;opacity:.8;font-size:12px}
#chat .ctx button{width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(243,239,227,.35);background:transparent;color:var(--cream);font-size:16px}
#chat .ctx:not([hidden]) + .in{border-top:0;padding-top:8px}
#chat .you{align-self:flex-end;max-width:88%;background:rgba(243,239,227,.1);border:1px solid rgba(243,239,227,.22);border-radius:14px 14px 4px 14px;padding:10px 12px;font-size:13.5px}
#chat .you p{margin:0}
#chat .att{border-left:3px solid var(--gold);padding:2px 8px;margin-bottom:6px;font-size:12px}
#chat .att span{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600}
#chat .msg ul{margin:0 0 8px;padding-left:18px} #chat .msg li{margin:2px 0}
#chat .typing{display:flex;gap:5px;padding:6px 2px}
#chat .typing i{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:tdot 1s infinite}
#chat .typing i:nth-child(2){animation-delay:.15s} #chat .typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,100%{opacity:.25}50%{opacity:1}}
#chat .in{padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(243,239,227,.12);display:flex;gap:10px;align-items:flex-end}
#chat textarea{flex:1;min-height:96px;resize:none;border-radius:12px;border:0;background:var(--cream);color:var(--forest);padding:10px 12px;font:inherit;font-size:14px}
#chat .send{width:48px;height:48px;border-radius:50%;border:0;background:var(--gold);color:var(--forest);font-size:20px;font-weight:700}
@media (max-width:600px){ #chat{width:100%;border-radius:0} #chatFab span{display:none} #chatFab{padding:8px} }

.flash{animation:flash 1.4s ease}
@keyframes flash{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 4px #F2B705}}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }

/* ---------- additions for the simulation ---------- */
.d-ms{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.d-ms li{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:start;font-size:13.5px}
.src{display:inline-flex;justify-content:center;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:600;border:1.5px solid currentColor;white-space:nowrap}
.src-yours{color:#1E6B45}.src-ref{color:#6A4FA0;border-style:dashed}.src-manual{color:#9A5B00}.src-none{color:#8A2E2E;border-style:dotted}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:90;
  max-width:min(560px,calc(100% - 32px));background:var(--forest);color:var(--cream);border:1.5px solid var(--gold);border-radius:14px;padding:12px 16px;font-size:13.5px;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
body.chat-open #toast{left:calc((100% - 400px)/2)}
body.dropping #stage{outline:4px dashed var(--gold);outline-offset:-10px}
.rv .picks button small{display:block;font-size:11px;font-weight:400;opacity:.75;line-height:1.2}
.rv .rvtools{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px;border:1.5px dashed var(--rv-ink);border-radius:10px;padding:5px 8px;font-size:12px;color:var(--rv-mute)}
.rv .rvtools button{border:1px solid var(--rv-line);background:#fff;border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600;min-height:36px}
@media (max-width:900px){.rv .rvtools{margin-left:0}}
.d-why{margin:0 0 14px;padding:10px 12px;border-left:4px solid #d4a94f;background:#FBF6E8;border-radius:0 10px 10px 0;font-size:14px;line-height:1.5}
.d-why span{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6B4F16;margin-bottom:2px}
.d-fill{border:1.5px solid #16213E;background:#d4a94f;border-radius:8px;padding:8px 14px;font-weight:600;min-height:40px;color:#16213E}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
</style>

<div class="rv">
  <div><h1 id="rvTitle"></h1><small id="rvSub"></small></div>
  <div class="picks" id="picks" role="group" aria-label="Choose an option"></div>
  <div class="rvtools" role="group" aria-label="Review controls, not part of the page"><span>Review only:</span><button type="button" data-rv="sample">Replay the sample hospital arriving</button><button type="button" data-rv="clear">Empty the page</button></div>
</div>
<div class="rv-note" id="rvNote"></div>
<main id="stage"></main>

<div id="peek" role="status" aria-live="polite"></div>
<div id="scrim"></div>
<section id="sheet" role="dialog" aria-modal="true" aria-label="Details"><div class="shbar"><button class="sh-ask" type="button"><i>T</i>Ask Tojo about this</button><button class="x" type="button" aria-label="Close">×</button></div><div id="sheetBody"></div></section>
<div id="toast" role="status" aria-live="polite"></div>

<button id="chatFab" type="button" aria-label="Open the chat with Tojo"><i class="t">T</i><span>Ask Tojo</span><i class="dot" aria-hidden="true"></i></button>
<aside id="chat" aria-label="Chat with Tojo">
  <header><i class="t">T</i><div><h3>Tojo</h3><small id="chatSub"></small></div><button type="button" id="chatClose" aria-label="Minimise the chat">–</button></header>
  <div class="body" id="chatBody"></div>
  <div class="ctx" id="chatCtx" hidden></div>
  <div class="in"><label class="sr" for="chatIn">Write to Tojo</label><textarea id="chatIn" placeholder="Write to Tojo…"></textarea><button class="send" type="button" aria-label="Send">→</button></div>
</aside>
<script>
/* ===== Simulation · page 1 (Your data) · data model =====
   One entry per data family. Each family lists the files that feed it and the measures the formula needs from it.

/* ---------- state ---------- */
function msState(m){
  if (m.src === "none") return "none";
  if (m.src === "manual") return "manual";
  return m.f.every(f => ST.files[f]) ? "yours" : "ref";
}
function domStats(d){
  const inn = d.files.filter(f => ST.files[f]).length;
  const ms = d.ms.map(msState);
  return { inn, of:d.files.length, cov: inn/d.files.length, yours: ms.filter(s=>s==="yours").length, msN: d.ms.length,
           state: inn===d.files.length ? "full" : inn===0 ? "empty" : "part", req: d.files.filter(f=>REQUIRED.includes(f) && !ST.files[f]) };
}
function stats(){
  const filesIn = ALL_FILES.filter(f => ST.files[f]).length;
  const reqIn = REQUIRED.filter(f => ST.files[f]).length;
  const all = Object.values(MS); const yours = all.filter(m => msState(m)==="yours").length;
  const mLinks = LINKS.filter(l => MS[l[0]]); const linkYours = mLinks.filter(l => msState(MS[l[0]])==="yours").length;
  const spans = Object.values(ST.files).filter(x => x.from).map(x => monthsBetween(x.from, x.to));
  const months = spans.length ? mode(spans) : 0;
  const rows = Object.values(ST.files).reduce((s,x)=>s+(x.rows||0),0);
  return { filesIn, filesOf:ALL_FILES.length, reqIn, reqOf:REQUIRED.length, yours, msOf:all.length, ref:all.length-yours,
           linkYours, linkOf:mLinks.length, months, rows, ready: reqIn===REQUIRED.length };
}
function monthsBetween(a,b){ const [y1,m1]=a.split("-").map(Number), [y2,m2]=(b||a).split("-").map(Number); return (y2-y1)*12+(m2-m1)+1; }
function mode(arr){ const c={}; arr.forEach(v=>c[v]=(c[v]||0)+1); return +Object.entries(c).sort((a,b)=>b[1]-a[1]||a[0]-b[0])[0][0]; }
function weightOf(mid){ return LINKS.filter(l=>l[0]===mid).reduce((s,l)=>s+l[2],0); }
function gaps(n=3){
  return Object.values(MS).filter(m => msState(m)!=="yours").sort((a,b)=>weightOf(b.id)-weightOf(a.id)).slice(0,n);
}
function gapLine(m){
  const s = msState(m);
  if (s==="ref"){ const miss = m.f.filter(f=>!ST.files[f]).map(f=>FILE_NAME[f]); return `${miss.join(", ")} not sent yet`; }
  if (s==="manual") return "Kept on paper: a register is needed";
  return "Not recorded today: start a register";
}
function kpiShare(kid){
  const ls = LINKS.filter(l => l[1]===kid && MS[l[0]]); if (!ls.length) return null;
  const tot = ls.reduce((s,l)=>s+l[2],0), y = ls.filter(l=>msState(MS[l[0]])==="yours").reduce((s,l)=>s+l[2],0);
  return { pct: Math.round(y/tot*100), n: ls.length, yours: ls.filter(l=>msState(MS[l[0]])==="yours").length };
}

/* ---------- intake ---------- */
const listeners = [];
function changed(arrivedFile){ listeners.forEach(fn => fn(arrivedFile)); }
function addFile(key, rows, from, to, own){ ST.files[key] = { rows, from, to, own:!!own }; }
function stemOf(name){ return name.toLowerCase().replace(/\.csv$/,"").replace(/\s*\(\d+\)$/,"").replace(/[^a-z0-9_]/g,"_").replace(/^_+|_+$/g,""); }
async function readFiles(list){
  for (const file of list){
    const key = stemOf(file.name);
    if (!FILE_DOM[key]) { if (!ST.unknown.includes(file.name)) ST.unknown.push(file.name); continue; }
    let text = ""; try { text = await file.text(); } catch(e) {}
    const lines = text.split(/\r?\n/).filter(l=>l.trim()); const rows = Math.max(0, lines.length-1);
    const ms = text.match(/\b(19|20)\d{2}-[01]\d(?=-[0-3]\d)/g) || [];
    const recent = ms.filter(x => x >= "2000-01").sort();
    addFile(key, rows, recent[0]||"", recent[recent.length-1]||"", true);
    changed(key);
    await new Promise(r=>setTimeout(r,60));
  }
  changed(null);
  if (ST.unknown.length) toast(`${ST.unknown.length} file${ST.unknown.length>1?"s":""} not recognised: ${ST.unknown.slice(0,3).join(", ")}${ST.unknown.length>3?"…":""}. Tojo will ask what ${ST.unknown.length>1?"they hold":"it holds"}.`);
}
function sampleFiles(keys){ keys.forEach(k => { const s = SAMPLE[k]; addFile(k, s[0], s[1], s[2]); }); }
function openingState(){ ST.files = {}; ST.unknown = []; sampleFiles(ALL_FILES.filter(f => !HELD_BACK.includes(f))); }
async function playSample(){
  if (ST.busy) return; ST.busy = true; ST.files = {}; ST.unknown = []; changed(null);
  const order = [...REQUIRED, ...ALL_FILES.filter(f=>!REQUIRED.includes(f))];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  for (const k of order){ sampleFiles([k]); changed(k); if (!reduce) await new Promise(r=>setTimeout(r,70)); }
  ST.busy = false; changed(null);
}
function clearAll(){ if (ST.busy) return; ST.files = {}; ST.unknown = []; changed(null); }
function wireIntake(root){
  const inp = root.querySelector('input[type=file]');
  if (inp) inp.addEventListener("change", e => { readFiles([...e.target.files]); e.target.value = ""; });
  root.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => {
    const a = b.dataset.act;
    if (a==="sample") playSample(); else if (a==="clear") clearAll(); else if (a==="go") goNext(); else if (a==="chat") openChat();
  }));
}

addEventListener("dragleave", e => { if (e.target === document.documentElement || !e.relatedTarget) document.body.classList.remove("dropping"); });
addEventListener("drop", e => { if (!e.dataTransfer?.files?.length) return; e.preventDefault(); document.body.classList.remove("dropping"); readFiles([...e.dataTransfer.files]); });

function goNext(){
  const s = stats();
  if (!s.ready) { const miss = REQUIRED.filter(f=>!ST.files[f]).map(f=>FILE_NAME[f]); toast(`Still needed before the formula can run: ${miss.slice(0,4).join(", ")}${miss.length>4?` and ${miss.length-4} more`:""}.`); return; }
  toast(`The formula is built from ${s.linkYours} links in your data and ${s.linkOf-s.linkYours} from reference. The next page, Targets, comes in the next round of options.`);
}

  return `<nav class="jr" aria-label="Simulation steps"><ol>${JOURNEY.map((j,i)=>`<li class="${i===cur?"now":i<cur?"done":""}"><button type="button" ${i===cur?'aria-current="step"':i>cur?'aria-disabled="true"':''} data-step="${i}"><b>${i<cur?"✓":i+1}</b><span>${esc(j[0])}<small>${esc(j[1])}</small></span></button></li>`).join("")}</ol></nav>`;
}
function pulseHTML(){
  return `<div class="pulse" role="group" aria-label="Readings">

}
function intakeHTML(){

    <label class="drop" for="fileIn"><input id="fileIn" type="file" multiple accept=".csv,text/csv"><span class="dz-big">Drop your files here</span><span class="dz-sub">or choose them: CSV exports from your HIS, ERP, roster and registers</span></label>

}
function watchHTML(){ return `<ul class="watch" data-v="watch" aria-label="Biggest gaps"></ul>`; }
function ctaHTML(){ return `<div class="cta"><button type="button" class="go" data-act="go">Build the formula <span aria-hidden="true">→</span></button><span class="cta-note" data-v="ctaNote"></span></div>`; }

function fillCommon(root){ { const _a = pageAlt("fillCommon"); if (_a) return _a(...arguments); }
  const s = stats();
  const set = (k,v) => root.querySelectorAll(`[data-v="${k}"]`).forEach(e => e.innerHTML = v);
  set("files", `${s.filesIn}<i>/${s.filesOf}</i>`); set("filesSub", `${s.reqIn} of ${s.reqOf} the formula needs`);
  set("ms", `${s.yours}<i>/${s.msOf}</i>`); set("msSub", `${s.ref} come from reference`);
  set("links", `${s.linkYours}<i>/${s.linkOf}</i>`); set("linksSub", "set by your own data");
  set("months", s.months ? `${s.months}<i> month${s.months>1?"s":""}</i>` : "—"); set("monthsSub", s.months ? (s.months<12 ? "12 needed to learn from you" : "enough to learn from") : "no dated files yet");

  set("ctaNote", s.ready ? `Ready. ${s.ref} measures will use reference weights until their data arrives.` : `${s.reqOf-s.reqIn} of the files the formula needs are still missing.`);
  root.querySelectorAll('[data-act="go"]').forEach(b => b.classList.toggle("ready", s.ready));
  const w = root.querySelector('[data-v="watch"]');
  if (w) w.innerHTML = gaps(3).map(m => `<li><button type="button" data-ref="ms:${m.id}" class="wi wi-${msState(m)}"><i aria-hidden="true">${msState(m)==="ref"?"⧗":msState(m)==="manual"?"✎":"?"}</i><span><b>${esc(m.n)}</b><small>${esc(gapLine(m))} · ${esc(DOM[m.dom].short)}</small></span></button></li>`).join("");
}

/* ---------- detail texts ---------- */
function fileRow(f){ const x = ST.files[f]; return `<li><span class="ck ${x?"y":""}">${x?"✓":""}</span><span>${esc(FILE_NAME[f])}<br><small style="color:var(--sh-mute)">${f}.csv${REQUIRED.includes(f)?" · needed to run":""}</small></span><em>${x?`${fmtN(x.rows)} rows${x.from?` · ${x.from}${x.to&&x.to!==x.from?` to ${x.to}`:""}`:""}`:"not sent"}</em></li>`; }
function msChip(m){ const s = msState(m); return `<li><span class="src src-${s}">${SRC_SHORT[s]}</span><span><b>${esc(m.n)}</b>${m.note?`<br><small style="color:var(--sh-mute)">${esc(m.note)}</small>`:""}</span></li>`; }
function domDetail(d){
  const s = domStats(d);

  <p class="d-sub"><span class="d-pill ${s.state==="full"?"ahead":s.state==="part"?"watch":"off"}">${s.state==="full"?"All files in":s.state==="part"?`${s.inn} of ${s.of} files in`:"Nothing in yet"}</span>${s.req.length?` &nbsp;Needed to run: ${s.req.map(f=>esc(FILE_NAME[f])).join(", ")}`:""}</p>

function msDetail(m){
  const s = msState(m), d = DOM[m.dom]; const ks = LINKS.filter(l=>l[0]===m.id);
  const how = s==="yours" ? "The formula reads this from your files and sets its links from your own numbers."
    : s==="ref" ? "Until the file arrives, the formula uses the reference value and the reference weights for a hospital of your size."
    : s==="manual" ? "This is written on paper today. The formula uses reference weights now; a simple register kept for two weeks lets your numbers replace them."
    : "Nobody records this today. The formula uses reference weights; Tojo will set up a short register so your numbers can replace them.";
  return `<div class="d-eyebrow">Measure · ${esc(d.name)}</div><div class="d-title">${esc(m.n)}</div>

  <div class="d-sec"><h4>What it moves</h4><div class="d-fac">${ks.map(l=>`<span>${esc(KP[l[1]]?.n||l[1])}</span><span class="bar" aria-label="weight ${l[2]}"><i style="width:${l[2]*100}%;background:var(--sh-state)"></i></span>`).join("")}</div></div>

function kpiDetail(k){
  const ls = LINKS.filter(l=>l[1]===k.id); const sh = kpiShare(k.id);

  <p class="d-sub">${sh?`<span class="d-pill ${sh.pct>=70?"ahead":sh.pct>=40?"watch":"off"}">${sh.pct}% of its pull set by your data</span>`:""}</p>
  <div class="d-sec"><h4>What feeds it</h4><ul class="d-ms">${ls.map(l=>{ const m = MS[l[0]]; if (!m) return `<li><span class="src src-yours">KPI</span><span><b>${esc(KP[l[0]].n)}</b> · weight ${l[2]}</span></li>`; return `<li><span class="src src-${msState(m)}">${SRC_SHORT[msState(m)]}</span><span><b>${esc(m.n)}</b> · weight ${l[2]}</span></li>`; }).join("")}</ul></div>`;

function fileDetail(f){ const d = DOM[FILE_DOM[f]]; return domDetail(d); }
function pulseDetail(id){
  const s = stats();
  const T = {
    files:["Files in", `${s.filesIn} of ${s.filesOf}`, `The formula needs ${s.reqOf} of them to run; ${s.reqIn} are in. The rest sharpen it.`],
    measures:["Measures from your data", `${s.yours} of ${s.msOf}`, `${s.ref} measures come from the reference files for now: some because a file has not been sent, some because they are kept on paper, and some because nobody records them.`],
    links:["Formula links", `${s.linkYours} of ${s.linkOf}`, `Each link says how much one measure moves a KPI. ${s.linkYours} are set from your data; the rest use reference weights, marked as such everywhere they appear.`],
    months:["History", s.months?`${s.months} month${s.months>1?"s":""}`:"—", "One month shows where you stand. Twelve months show how your measures move together, so the formula can learn its links from you instead of from reference."]
  }[id];
  return `<div class="d-eyebrow">Reading</div><div class="d-title">${T[0]}: ${T[1]}</div><p style="margin:0">${T[2]}</p>
  <div class="d-sec"><h4>Data families</h4><ul class="d-list">${DOMAINS.map(d=>{ const x = domStats(d); return `<li><span class="ck ${x.state==="full"?"y":x.state==="empty"?"late":""}">${x.state==="full"?"✓":x.state==="empty"?"!":"·"}</span><span>${esc(d.name)}</span><em>${x.inn}/${x.of} files · ${x.yours}/${x.msN} measures</em></li>`; }).join("")}</ul></div>`;
}
function detailFor(ref){ { const _a = pageAlt("detailFor"); if (_a) return _a(...arguments); }
  const [t,id] = ref.split(":");
  if (t==="dom") { const s = domStats(DOM[id]); return [domDetail(DOM[id]), s.state==="full"?"ahead":s.state==="part"?"watch":"off"]; }
  if (t==="file") { const s = domStats(DOM[FILE_DOM[id]]); return [fileDetail(id), s.state==="full"?"ahead":"watch"]; }
  if (t==="ms") { const s = msState(MS[id]); return [msDetail(MS[id]), s==="yours"?"ahead":s==="ref"?"watch":"off"]; }
  if (t==="kpi") return [kpiDetail(KP[id]), "ahead"];
  if (t==="pulse") return [pulseDetail(id), "ahead"];
  return ["",""];
}
function peekFor(ref){ { const _a = pageAlt("peekFor"); if (_a) return _a(...arguments); }
  const [t,id] = ref.split(":");
  if (t==="dom"){ const d = DOM[id], s = domStats(d); return `<div class="pk-t">${esc(d.name)}</div><div class="pk-n">${s.inn}/${s.of} files</div><div class="pk-m">${s.yours} of ${s.msN} measures from your data${s.req.length?` · needed to run: ${s.req.map(f=>FILE_NAME[f]).join(", ")}`:""}</div><div class="pk-hint">Click for files, measures and what to ask IT for</div>`; }
  if (t==="file"){ const x = ST.files[id]; return `<div class="pk-t">${esc(FILE_NAME[id])}</div><div class="pk-m">${id}.csv · ${esc(DOM[FILE_DOM[id]].name)}</div><div class="pk-n">${x?`${fmtN(x.rows)} rows`:"Not sent"}</div>${x&&x.from?`<div class="pk-m">${x.from}${x.to!==x.from?` to ${x.to}`:""}</div>`:""}<div class="pk-hint">${REQUIRED.includes(id)?"Needed to run the formula":"Sharpens the formula"}</div>`; }
  if (t==="ms"){ const m = MS[id], s = msState(m); return `<div class="pk-t">${esc(m.n)}</div><div class="pk-m"><b>${SRC_WORD[s]}</b></div><div class="pk-m">${esc(s==="yours"?`Read from ${m.f.map(f=>FILE_NAME[f]).join(" and ")}`:gapLine(m))}</div><div class="pk-hint">Moves ${LINKS.filter(l=>l[0]===id).map(l=>KP[l[1]]?.n).join(", ")}</div>`; }
  if (t==="kpi"){ const k = KP[id], sh = kpiShare(id); return `<div class="pk-t">${esc(k.n)}</div>${sh?`<div class="pk-n">${sh.pct}%</div><div class="pk-m">of its pull set by your data · ${sh.yours} of ${sh.n} inputs</div>`:""}<div class="pk-hint">Click to see what feeds it</div>`; }
  if (t==="pulse"){ return `<div class="pk-t">${{files:"Files in",measures:"Measures from your data",links:"Formula links",months:"History"}[id]}</div><div class="pk-hint">Click for the full count by data family</div>`; }
  return "";
}
function contextFor(ref){ { const _a = pageAlt("contextFor"); if (_a) return _a(...arguments); }
  const [t,id] = ref.split(":");
  if (t==="dom"){ const d = DOM[id], s = domStats(d); return { kind:"Data family", point:`the ${d.name} data`, title:d.name, lines:[`${s.inn} of ${s.of} files in · ${s.yours} of ${s.msN} measures from our data`] }; }
  if (t==="file"){ const x = ST.files[id]; return { kind:"File", point:`the ${FILE_NAME[id]} file`, title:FILE_NAME[id], lines:[x?`${fmtN(x.rows)} rows`:"Not sent yet"] }; }
  if (t==="ms"){ const m = MS[id]; return { kind:"Measure", point:`the measure "${m.n}"`, title:m.n, lines:[SRC_WORD[msState(m)]] }; }
  if (t==="kpi"){ const k = KP[id], sh = kpiShare(id); return { kind:"KPI", point:`what feeds ${k.n}`, title:k.n, lines:sh?[`${sh.pct}% of its pull set by our data`]:[] }; }
  if (t==="pulse"){ return { kind:"Reading", point:`the ${id} reading`, title:{files:"Files in",measures:"Measures from your data",links:"Formula links",months:"History"}[id], lines:[] }; }
  return { kind:"Item", point:"this", title:"This item", lines:[] };
}

/* ---------- peek ---------- */
const peek = document.getElementById("peek"); let peekT, hideT;
function showPeek(el){ const ref = el.dataset.ref; const h = ref && peekFor(ref); if (!h) return; clearTimeout(hideT);
  peek.innerHTML = `<div class="pk-bar"><button type="button" class="pk-ask" data-ask="${ref}"><i>T</i>Ask Tojo about this</button><button type="button" class="pk-x" aria-label="Close">×</button></div>${h}`;
  peek.classList.add("on");
  const r = el.getBoundingClientRect(); const pw = peek.offsetWidth, ph = peek.offsetHeight;
  let x = r.left + r.width/2 - pw/2; x = Math.max(8, Math.min(innerWidth - pw - 8 - (document.body.classList.contains("chat-open") && innerWidth > 900 ? 400 : 0), x));
  let y = r.top - ph - 8; if (y < 8) y = r.bottom + 8; peek.style.left = x+"px"; peek.style.top = y+"px"; }
function hidePeek(){ clearTimeout(hideT); peek.classList.remove("on"); }
function laterHide(ms=260){ clearTimeout(hideT); hideT = setTimeout(()=>{ if (!peek.matches(":hover") && !peek.contains(document.activeElement)) hidePeek(); }, ms); }
document.addEventListener("pointerover", e => { if (e.pointerType==="touch") return; if (peek.contains(e.target)) { clearTimeout(hideT); return; } const el = e.target.closest("#stage [data-ref]"); if (!el) return; clearTimeout(peekT); peekT = setTimeout(()=>showPeek(el), 120); });
document.addEventListener("pointerout", e => { if (e.target.closest("#stage [data-ref]") || peek.contains(e.target)) { clearTimeout(peekT); laterHide(); } });
let pressT; document.addEventListener("touchstart", e => { if (peek.contains(e.target)) return; const el = e.target.closest("#stage [data-ref]"); if (!el) return; pressT = setTimeout(()=>showPeek(el), 380); }, {passive:true});
document.addEventListener("touchend", () => clearTimeout(pressT));
addEventListener("scroll", () => { if (!peek.contains(document.activeElement)) hidePeek(); }, {passive:true});
peek.addEventListener("click", e => { e.stopPropagation(); if (e.target.closest(".pk-x")) return hidePeek(); const a = e.target.closest("[data-ask]"); if (a) { askTojo(a.dataset.ask); hidePeek(); } });
document.addEventListener("click", e => { const el = e.target.closest("#stage [data-ref]"); if (el && !el.closest("[data-noopen]")) openSheet(el.dataset.ref); });

/* ---------- sheet ---------- */
const sheet = document.getElementById("sheet"), scrim = document.getElementById("scrim"), sheetBody = document.getElementById("sheetBody");
function openSheet(ref){ const [h,st] = detailFor(ref); if (!h) return; hidePeek(); sheet.dataset.ref = ref;
  sheet.style.setProperty("--sh-state", st==="off"?"var(--c-bad)":st==="watch"?"var(--c-warn)":"var(--c-ok)");
  sheetBody.innerHTML = h; sheet.classList.add("on"); scrim.classList.add("on"); sheet.scrollTop = 0; sheet.querySelector(".sh-ask").focus(); }
function closeSheet(){ sheet.classList.remove("on"); scrim.classList.remove("on"); }
sheet.querySelector(".x").onclick = closeSheet; scrim.onclick = closeSheet;
sheet.querySelector(".sh-ask").onclick = () => askTojo(sheet.dataset.ref);
addEventListener("keydown", e => { if (e.key==="Escape") { if (sheet.classList.contains("on")) closeSheet(); else if (peek.classList.contains("on")) hidePeek(); else closeChat(); } });

/* ---------- chat (the tools' chat look) ---------- */
const chatIn = document.getElementById("chatIn"), chatBody = document.getElementById("chatBody"), ctxBox = document.getElementById("chatCtx");
let chatCtx = null;
function chatOpening(){ { const _a = pageAlt("chatOpening"); if (_a) return _a(...arguments); }
  const s = stats(); const g = gaps(4);
  return {
    msg:[ s.filesIn ? `${s.filesIn} of the ${s.filesOf} files are in. They give ${s.yours} of the ${s.msOf} measures the formula needs; the other ${s.ref} come from our reference files until your data arrives, and each one is marked so you can see it.` : "Nothing is in yet. The formula already runs on reference weights for a hospital of your size; every file you drop replaces some of them with your own numbers.",
          s.months && s.months < 12 ? `One thing matters more than the missing files: the files cover ${s.months} month${s.months>1?"s":""}. That shows where you stand today, but not how your measures move together, so most links in the formula still lean on reference weights.` : "Twelve months of history lets your own data set the links in the formula.",
          "Pick a point to add to it, or choose what to do next." ],

    points: [ s.months && s.months<12 ? `Only ${s.months} month${s.months>1?"s":""} of history` : "History is long enough", ...g.slice(0,3).map(m => `${m.n}: ${SRC_SHORT[msState(m)].toLowerCase()}`) ],

}

  document.getElementById("chatSub").textContent = "Simulation · step 1 of 8 · your data";
  chatBody.innerHTML = `<div class="msg">${c.msg.map(m=>`<p>${esc(m)}</p>`).join("")}</div><div class="lbl">Tojo's note</div><div class="note">${esc(c.note)}</div>
  <div class="lbl">Add to a point — pick one or more</div>${c.points.map((t,i)=>`<button class="pt" type="button" aria-pressed="false"><b>P${i+1}</b> ${esc(t)}</button>`).join("")}

function openChat(){ document.body.classList.add("chat-open"); setTimeout(()=>chatIn.focus(), 300); }
function closeChat(){ document.body.classList.remove("chat-open"); }
document.getElementById("chatFab").onclick = openChat;
document.getElementById("chatClose").onclick = closeChat;
function askTojo(ref){
  const c = contextFor(ref); chatCtx = { ref, ...c };
  ctxBox.innerHTML = `<div><span>${esc(c.kind)}</span><b>${esc(c.title)}</b>${c.lines.map(l=>`<small>${esc(l)}</small>`).join("")}</div><button type="button" aria-label="Remove the attached item">×</button>`;
  ctxBox.hidden = false; ctxBox.querySelector("button").onclick = () => { chatCtx = null; ctxBox.hidden = true; };
  chatIn.value = `Tell me more about ${c.point}: where this stands, whether there is any delay or overrun on it, who or what is responsible for it, whether we have any way to recover, and how we are planning to recover.`;

}
function replyFor(text, ctx){ { const _a = pageAlt("replyFor"); if (_a) return _a(...arguments); }
  const s = stats(); const q = text.toLowerCase();

      if (st==="yours") return [`${m.n} comes from your own files, so its links are set from your numbers. Nothing is late on it.`, `It moves ${LINKS.filter(l=>l[0]===id).map(l=>KP[l[1]]?.n).join(" and ")}.`];
      if (st==="ref") return [`${m.n} is waiting on ${m.f.filter(f=>!ST.files[f]).map(f=>FILE_NAME[f]).join(" and ")}. Until it arrives the formula uses the reference value for a hospital of your size.`, `The IT team owns this. ${DOM[m.dom].it}`, "Once the file is in, the reference value is replaced on the next run. Nothing else has to change."];
      return [`${m.n} is ${st==="manual"?"kept on paper":"not recorded anywhere"} today, so the formula uses reference weights for it.`, m.note||"", "To recover: a short register kept for two weeks by the person on duty is enough. I can draft the register and name who should keep it once your team is in place (step 7)."]; }
    if (t==="dom"){ const d = DOM[id], x = domStats(d); return [`${d.name}: ${x.inn} of ${x.of} files in, ${x.yours} of ${x.msN} measures from your data.`, x.inn<x.of?`Missing: ${d.files.filter(f=>!ST.files[f]).map(f=>FILE_NAME[f]).join(", ")}. ${d.it}`:"Everything in this family is in.", "The IT team owns the exports; I'll mark each measure as yours as soon as its file lands."]; }

function sendChat(){

mount(stage){
  const G = 452, FH = 34, BW = 86, SW = 14, gap = 22, W = 30*2 + DOMAINS.length*(BW+SW+gap) - gap;

    const lights = d.ms.map((m,i) => { const lx = bx + 12 + i*((BW-24)/Math.max(1,d.ms.length-1||1)); const cx = d.ms.length===1? bx+BW/2 : lx;

    return `<g class="bld" data-dom="${d.id}">
      <polygon points="${bx+BW},${top} ${bx+BW+SW},${top-10} ${bx+BW+SW},${G-10} ${bx+BW},${G}" fill="var(--n-side)"/>

    </g>`; }).join("");

        ${star.join("")}
        <path d="M0 ${G-60} L60 ${G-60} L60 ${G-110} L130 ${G-110} L130 ${G-80} L210 ${G-80} L210 ${G-140} L260 ${G-140} L260 ${G-70} L380 ${G-70} L380 ${G-120} L470 ${G-120} L470 ${G-90} L600 ${G-90} L600 ${G-150} L660 ${G-150} L660 ${G-75} L800 ${G-75} L800 ${G-130} L880 ${G-130} L880 ${G-95} L1010 ${G-95} L1010 ${G-140} L1090 ${G-140} L1090 ${G-70} L${W} ${G-70} L${W} ${G} L0 ${G}Z" fill="#172238" opacity=".8"/>

    ${ctaHTML()}</div>`;

LOOKS.push({ key:"web", step:0, letter:"B", name:"One formula", note:"<b>B · One formula.</b> The single formula drawn as a wheel. Outer ring: the ten data families and their files. Middle ring: the measures. Centre: the KPIs, with EBITDA at the heart. A solid green link is learned from your data; a dashed violet link uses reference weights. Rest on any KPI or measure to see what it pulls.",
css: WEB_CSS,
mount(stage){
  const C = 540, RK = 150, RM = 290, RA = 468, RF = 506, S = 1080;
  const pt = (r,a) => [C + r*Math.cos(a), C + r*Math.sin(a)];
  // measures around the middle ring, grouped by family, with a gap between families
  const total = DOMAINS.reduce((s,d)=>s+d.ms.length,0), gapA = 0.09, step = (2*Math.PI - gapA*DOMAINS.length)/total;
  let a = -Math.PI/2 + gapA/2; const MP = {}, arcs = [];
  DOMAINS.forEach(d => { const a0 = a; d.ms.forEach(m => { MP[m.id] = a + step/2; a += step; }); arcs.push([d,a0,a]); a += gapA; });
  const KPOS = { EBITDA:[C,C] }; KPIS.filter(k=>k.id!=="EBITDA").forEach((k,i,arr)=>{ KPOS[k.id] = pt(RK, -Math.PI/2 + i*2*Math.PI/arr.length); });
  const edges = LINKS.map(([s,t,w],i) => {
    const tp = KPOS[t]; if (!tp) return "";
    if (MS[s]) { const sp = pt(RM, MP[s]), cp = pt(RM*0.55, MP[s]);
      return `<path class="e" data-s="${s}" data-t="${t}" d="M${sp[0].toFixed(1)} ${sp[1].toFixed(1)} Q${cp[0].toFixed(1)} ${cp[1].toFixed(1)} ${tp[0].toFixed(1)} ${tp[1].toFixed(1)}" stroke-width="${(0.8+w*2.6).toFixed(2)}"/>`; }
    const sp = KPOS[s]; return `<path class="e kk" data-s="${s}" data-t="${t}" d="M${sp[0].toFixed(1)} ${sp[1].toFixed(1)} L${tp[0].toFixed(1)} ${tp[1].toFixed(1)}" stroke-width="${(1+w*2.5).toFixed(2)}"/>`;
  }).join("");
  const mnodes = Object.values(MS).map(m => { const [x,y] = pt(RM, MP[m.id]); const ang = MP[m.id]; const right = Math.cos(ang) >= 0;
    const [lx,ly] = pt(RM + 14, ang);
    return `<g class="mn" data-ms="${m.id}" data-ref="ms:${m.id}" tabindex="0" role="button" aria-label="${esc(m.n)}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="14" fill="transparent"/><circle class="d" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7"/>
      <text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" dy="4" text-anchor="${right?"start":"end"}" transform="rotate(${(right? ang*180/Math.PI : ang*180/Math.PI+180).toFixed(1)} ${lx.toFixed(1)} ${ly.toFixed(1)})">${esc(m.n.length>30?m.n.slice(0,29)+"…":m.n)}</text></g>`; }).join("");
  const arcEls = arcs.map(([d,a0,a1]) => { const p0 = pt(RA,a0), p1 = pt(RA,a1); const large = (a1-a0) > Math.PI ? 1 : 0; const mid = (a0+a1)/2; const flip = Math.sin(mid) > 0.1;
    const t0 = pt(RA, flip ? a1 : a0), t1 = pt(RA, flip ? a0 : a1);
    const files = d.files.map((f,i) => { const fa = a0 + (i+0.5)*(a1-a0)/d.files.length; const [fx,fy] = pt(RF, fa);
      return `<g class="ft${REQUIRED.includes(f)?" need":""}" data-file="${f}" data-ref="file:${f}" tabindex="0" role="button" aria-label="${esc(FILE_NAME[f])}"><rect x="${(fx-6).toFixed(1)}" y="${(fy-6).toFixed(1)}" width="12" height="12" rx="2.5" transform="rotate(${(fa*180/Math.PI).toFixed(1)} ${fx.toFixed(1)} ${fy.toFixed(1)})"/></g>`; }).join("");
    return `<g class="arc" data-ref="dom:${d.id}" tabindex="0" role="button" aria-label="${esc(d.name)}"><path class="band" d="M${p0[0].toFixed(1)} ${p0[1].toFixed(1)} A${RA} ${RA} 0 ${large} 1 ${p1[0].toFixed(1)} ${p1[1].toFixed(1)}"/>
      <path id="arc-${d.id}" fill="none" d="M${t0[0].toFixed(1)} ${t0[1].toFixed(1)} A${RA} ${RA} 0 ${large} ${flip?0:1} ${t1[0].toFixed(1)} ${t1[1].toFixed(1)}"/>
      <text dy="4.5"><textPath href="#arc-${d.id}" startOffset="50%" text-anchor="middle">${esc(d.short)}</textPath></text></g>${files}`; }).join("");
  const knodes = KPIS.map(k => { const [x,y] = KPOS[k.id]; const core = k.id==="EBITDA"; const r = core?62:44;
    return `<g class="kn${core?" core":""}" data-k="${k.id}" data-ref="kpi:${k.id}" tabindex="0" role="button" aria-label="${esc(k.n)}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}"/>
      <text class="k" x="${x.toFixed(1)}" y="${(y-(core?2:1)).toFixed(1)}" text-anchor="middle">${esc(k.s||k.n)}</text><text class="p" data-kp="${k.id}" x="${x.toFixed(1)}" y="${(y+(core?22:17)).toFixed(1)}" text-anchor="middle"></text></g>`; }).join("");
  stage.innerHTML = `<div class="lk lk-web">${journeyHTML()}
    <div class="grid"><div class="side"><div class="head"><div class="eb">Simulation · step 1 of 8 · ${esc(HOSPITAL.name)}, ${HOSPITAL.beds} beds</div><h1>One formula, built from your data</h1><p class="lede">Every file you send firms up the links it feeds. Where a file is missing, the link still works, using reference weights, drawn dashed until your numbers replace them.</p></div>
      ${pulseHTML()}<div>${intakeHTML()}<h2>Links still on reference</h2>${watchHTML()}${ctaHTML()}</div></div>
      <div><div class="wheel"><div class="hand" aria-hidden="true">solid = learned from you</div>
        <svg viewBox="0 0 ${S} ${S}" role="img" aria-label="The formula wheel: families and files outside, measures in the middle ring, KPIs at the centre">${edges}${arcEls}${mnodes}${knodes}</svg>
        <div class="lg"><span><svg width="26" height="8"><line x1="1" y1="4" x2="25" y2="4" stroke="#1E7A4C" stroke-width="3"/></svg>Link from your data</span><span><svg width="26" height="8"><line x1="1" y1="4" x2="25" y2="4" stroke="#6C4BB4" stroke-width="2.5" stroke-dasharray="4 4"/></svg>Link from reference</span><span><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="#FBE4CC" stroke="#C76A12" stroke-width="2"/></svg>On paper</span><span><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="#fff" stroke="#B23B3B" stroke-width="2" stroke-dasharray="1.5 2"/></svg>Not recorded</span><span><svg width="12" height="12"><rect x="1" y="1" width="10" height="10" rx="2" fill="#16213E"/></svg>File in</span><span><svg width="12" height="12"><rect x="1" y="1" width="10" height="10" rx="2" fill="#fff" stroke="#B23B3B" stroke-width="1.5"/></svg>Needed, not sent</span></div>
      </div>
      <ul class="fam" aria-label="Data families">${DOMAINS.map(d=>`<li><button type="button" data-ref="dom:${d.id}"><b>${esc(d.name)}</b><small data-v="fm-${d.id}"></small><span class="bar"><i data-bar="${d.id}"></i></span></button></li>`).join("")}</ul></div>
    </div></div>`;
  wireIntake(stage);
  const svg = stage.querySelector(".wheel svg");
  const focus = id => { svg.classList.add("focus"); svg.querySelectorAll(".e").forEach(e => e.classList.toggle("hl", e.dataset.s===id || e.dataset.t===id));
    const near = new Set([id]); LINKS.forEach(l => { if (l[0]===id) near.add(l[1]); if (l[1]===id) near.add(l[0]); });
    svg.querySelectorAll(".mn,.kn").forEach(n => n.classList.toggle("hl", near.has(n.dataset.ms||n.dataset.k))); };
  const unfocus = () => { svg.classList.remove("focus"); svg.querySelectorAll(".hl").forEach(n=>n.classList.remove("hl")); };
  svg.querySelectorAll(".mn,.kn").forEach(n => { n.addEventListener("pointerenter", () => focus(n.dataset.ms||n.dataset.k)); n.addEventListener("pointerleave", unfocus); n.addEventListener("focus", () => focus(n.dataset.ms||n.dataset.k)); n.addEventListener("blur", unfocus); });
},
update(root, arrived){
  root.querySelectorAll(".ft").forEach(g => g.classList.toggle("in", !!ST.files[g.dataset.file]));
  root.querySelectorAll(".mn").forEach(g => { const was = g.classList.contains("yours"); const s = msState(MS[g.dataset.ms]); g.setAttribute("class", "mn " + s + (s==="yours" && !was && arrived ? " pop" : "")); });
  root.querySelectorAll(".e:not(.kk)").forEach(e => { const s = msState(MS[e.dataset.s]); e.classList.remove("yours","ref","manual","none"); e.classList.add(s); });
  root.querySelectorAll("[data-kp]").forEach(t => { const sh = kpiShare(t.dataset.kp); t.textContent = sh ? `${sh.pct}% yours` : ""; });
  DOMAINS.forEach(d => { const s = domStats(d); root.querySelectorAll(`[data-v="fm-${d.id}"]`).forEach(t => t.textContent = `${s.inn}/${s.of} files · ${s.yours}/${s.msN} measures`); root.querySelectorAll(`[data-bar="${d.id}"]`).forEach(b => b.style.width = (s.yours/s.msN*100)+"%"); });
}});

mount(stage){
  const drawers = DOMAINS.map(d => `<div class="drw" data-dom="${d.id}">
    <div class="folders">${d.files.map(f=>`<button type="button" class="fo${REQUIRED.includes(f)?" need":""}" data-file="${f}" data-ref="file:${f}" aria-label="${esc(FILE_NAME[f])}"></button>`).join("")}</div>
    <div class="front"><button type="button" class="holder" data-ref="dom:${d.id}"><b>${esc(d.name)}</b><small data-v="rc-${d.id}"></small></button><div class="handle" aria-hidden="true"></div>
      <ul class="slips">${d.ms.map(m=>`<li><button type="button" class="slip" data-ms="${m.id}" data-ref="ms:${m.id}"><span>${esc(m.n)}</span><em class="st"></em></button></li>`).join("")}</ul></div></div>`).join("");
  stage.innerHTML = `<div class="lk lk-records">${journeyHTML()}
    <div class="mast"><div><div class="eb">Simulation · register of records · ${esc(HOSPITAL.name)}, ${HOSPITAL.beds} beds</div><h1>Your hospital's data</h1><p class="lede">Every number the formula uses is filed here with where it came from. A folder for each file you send; a stamp on each measure saying whether it is your data, a reference value, kept on paper, or not recorded at all.</p></div><div class="regno">Step 1 of 8</div></div>
    ${pulseHTML()}
    <div class="sec"><div class="no">1</div><div><h2>Send your files</h2><div class="two">${intakeHTML()}<div class="receipt"><h2>Outstanding, by weight on your KPIs</h2>${watchHTML()}</div></div></div></div>
    <div class="sec"><div class="no">2</div><div><h2>The cabinet: ten drawers, one per data family</h2><div class="cab">${drawers}</div>
      <div class="lg"><span><b style="color:var(--r-manila2)">▮</b> Folder: file in</span><span><b style="color:#7D8775">▯</b> Empty slot: not sent</span><span><b style="color:#E89A9A">▯</b> Needed to run</span><span style="color:var(--r-yours);font-weight:600">YOUR DATA</span><span style="color:var(--r-ref);font-weight:600">REFERENCE</span><span style="color:var(--r-paper2);font-weight:600">ON PAPER</span><span style="color:var(--r-none);font-weight:600">NOT RECORDED</span></div></div></div>
    <div class="sec"><div class="no">3</div><div><h2>Build the formula</h2>${ctaHTML()}</div></div>
  </div>`;
  wireIntake(stage);
},
update(root, arrived){
  root.querySelectorAll(".fo").forEach(b => { const on = !!ST.files[b.dataset.file]; b.classList.toggle("in", on); if (arrived && b.dataset.file===arrived){ b.classList.remove("drop-in"); void b.offsetWidth; b.classList.add("drop-in"); } });
  root.querySelectorAll(".slip").forEach(b => { const s = msState(MS[b.dataset.ms]); b.className = "slip " + s; b.querySelector(".st").textContent = SRC_SHORT[s]; });
  DOMAINS.forEach(d => { const s = domStats(d); root.querySelectorAll(`[data-v="rc-${d.id}"]`).forEach(t => t.textContent = `${s.inn} of ${s.of} files · ${s.yours} of ${s.msN} measures yours`); });
}});

/* ===== Option D · The trace: a printed ECG strip, one lead per data family; every file sent is a beat, every missing one a flat line ===== */
LOOKS.push({ key:"strip", letter:"D", name:"The trace", note:"<b>D · The trace.</b> A printed ECG strip on pink grid paper. Each lead is a data family. Every file that arrives prints a beat; a file not sent is a flat dashed line. At the end of each lead, its measures: a full square pulse from your data, a dashed one from reference, a short orange one kept on paper, a ring where nothing is recorded. The interpretation box reads it like the machine would.",
css:`
.lk-strip{--s-paper:#FFF3F1;--s-minor:#F5CFCB;--s-major:#EBA39C;--s-ink:#1B1B1F;--s-mute:#5C4D4D;--s-red:#C21F32;--s-ref:#6447A8;--s-paper2:#D86B0E;--s-sheet:#FFFCFB;
  --pk-bg:#1B1B1F;--pk-fg:#FFF3F1;--pk-line:#4A3A3A;--sh-bg:#FFFCFB;--sh-fg:#1B1B1F;--sh-mute:#5C4D4D;--sh-line:#EBCFCB;--sh-card:#fff;--c-ok:#1E6B45;--c-warn:#8A5A00;--c-bad:#C21F32;

mount(stage){
  const W = 1240, LH = 74, TOP = 14, X0 = 176, X1 = 980, M0 = 1004, M1 = W - 14, ROM = ["I","II","III","IV","V","VI","VII","VIII","IX","X"];
  const beat = (x, w, y) => { const u = w/40; // a P-QRS-T complex scaled to the segment
    const p = [[0,0],[5,0],[7,-3],[9,0],[13,0],[14,2],[16,-26],[18,8],[19.5,0],[24,0],[27,-6],[30,0],[40,0]];
    return "M" + p.map(([a,b]) => `${(x+a*u).toFixed(1)} ${(y+b*(LH/74)).toFixed(1)}`).join(" L"); };
  const rows = DOMAINS.map((d,i) => { const y0 = TOP + i*LH, base = y0 + LH*0.62, sw = (X1-X0)/d.files.length;
    const beats = d.files.map((f,j) => { const x = X0 + j*sw;
      return `<g class="bt${REQUIRED.includes(f)?" need":""}" data-file="${f}" data-ref="file:${f}" tabindex="0" role="button" aria-label="${esc(FILE_NAME[f])}"><rect class="hit" x="${x.toFixed(1)}" y="${y0+4}" width="${sw.toFixed(1)}" height="${LH-8}"/><path class="tr" d="${beat(x,Math.min(sw,150),base)}${sw>150?` L${(x+sw).toFixed(1)} ${base.toFixed(1)}`:""}"/><path class="flat" d="M${x.toFixed(1)} ${base.toFixed(1)} L${(x+sw).toFixed(1)} ${base.toFixed(1)}"/></g>`; }).join("");
    const mw = (M1-M0)/d.ms.length;
    const cals = d.ms.map((m,j) => { const x = M0 + j*mw;
      return `<g class="cal" data-ms="${m.id}" data-ref="ms:${m.id}" tabindex="0" role="button" aria-label="${esc(m.n)}"><rect class="hit" x="${x.toFixed(1)}" y="${y0+4}" width="${mw.toFixed(1)}" height="${LH-8}"/><path data-x="${x.toFixed(1)}" data-w="${mw.toFixed(1)}" data-b="${base.toFixed(1)}" d=""/><circle class="q" cx="${(x+mw/2).toFixed(1)}" cy="${(base-14).toFixed(1)}" r="6"/></g>`; }).join("");
    return `<g data-dom="${d.id}"><line x1="0" y1="${y0+LH}" x2="${W}" y2="${y0+LH}" stroke="var(--s-major)" stroke-width="1"/>
      <g class="ld" data-ref="dom:${d.id}" tabindex="0" role="button" aria-label="${esc(d.name)}"><rect x="10" y="${y0+10}" width="152" height="${LH-20}" rx="3"/><text class="n" x="20" y="${y0+36}">${ROM[i]} · ${esc(d.short)}</text><text class="c" data-v="sl-${d.id}" x="20" y="${y0+54}"></text></g>
      <line x1="${X0-6}" y1="${base}" x2="${X0}" y2="${base}" class="tr"/>${beats}<line x1="${X1}" y1="${base}" x2="${M0}" y2="${base}" class="tr" style="stroke-width:1.4"/>${cals}</g>`; }).join("");
  const H = TOP*2 + DOMAINS.length*LH;
  stage.innerHTML = `<div class="lk lk-strip">${journeyHTML()}
    <div class="hdr"><div><div class="eb">Simulation · step 1 of 8 · ${esc(HOSPITAL.name)}, ${HOSPITAL.beds} beds</div><h1>Your hospital's data, <em>read like a trace</em></h1><p class="lede">Ten leads, one per data family. A beat for every file that has arrived; a flat line for every one still to come. The formula runs on the beats and fills the flat lines from our reference files.</p></div>${pulseHTML()}</div>
    <div class="row2">${intakeHTML()}<div class="interp"><h2>Interpretation</h2><p class="rhythm" data-v="rhythm"></p>${watchHTML()}</div></div>
    <div class="strip"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ten leads, one per data family">${rows}<line x1="${X1+12}" y1="0" x2="${X1+12}" y2="${H}" stroke="var(--s-ink)" stroke-width="1" stroke-dasharray="2 4"/><text x="${M0}" y="12" font-size="10.5" font-weight="600" fill="var(--s-mute)" letter-spacing="1.2">MEASURES</text><text x="${X0}" y="12" font-size="10.5" font-weight="600" fill="var(--s-mute)" letter-spacing="1.2">FILES</text><rect class="sweep" x="0" y="0" width="40" height="${H}"><animate attributeName="x" from="${X0}" to="${M1}" dur="9s" repeatCount="indefinite"/></rect></svg>
      <div class="note" aria-hidden="true"></div>
      <div class="lg"><span><svg width="30" height="14"><path d="M1 10 L9 10 L11 2 L13 12 L15 10 L29 10" fill="none" stroke="#1B1B1F" stroke-width="2"/></svg>File in</span><span><svg width="30" height="14"><path d="M1 7 L29 7" stroke="#5C4D4D" stroke-width="1.6" stroke-dasharray="5 5"/></svg>Not sent</span><span><svg width="30" height="14"><path d="M1 7 L29 7" stroke="#C21F32" stroke-width="1.6" stroke-dasharray="5 5"/></svg>Needed to run</span><span><svg width="22" height="14"><path d="M1 12 L5 12 L5 2 L15 2 L15 12 L21 12" fill="none" stroke="#1B1B1F" stroke-width="2"/></svg>Your data</span><span><svg width="22" height="14"><path d="M1 12 L5 12 L5 2 L15 2 L15 12 L21 12" fill="none" stroke="#6447A8" stroke-width="2" stroke-dasharray="4 3"/></svg>Reference</span><span><svg width="22" height="14"><path d="M1 12 L5 12 L5 8 L15 8 L15 12 L21 12" fill="none" stroke="#D86B0E" stroke-width="2"/></svg>On paper</span><span><svg width="22" height="14"><circle cx="11" cy="7" r="5" fill="none" stroke="#C21F32" stroke-width="1.8"/></svg>Not recorded</span></div></div>
    <ul class="fam" aria-label="Data families">${DOMAINS.map(d=>`<li><button type="button" data-ref="dom:${d.id}"><b>${esc(d.name)}</b><small data-v="sf-${d.id}"></small></button></li>`).join("")}</ul>
    ${ctaHTML()}</div>`;
  this._geo = { W, H, X0, X1 };
  wireIntake(stage);
},
update(root, arrived){
  root.querySelectorAll(".bt").forEach(g => { const on = !!ST.files[g.dataset.file]; g.classList.toggle("in", on); if (arrived && g.dataset.file===arrived){ g.classList.remove("draw"); void g.getBBox; g.classList.add("draw"); } });
  root.querySelectorAll(".cal").forEach(g => { const s = msState(MS[g.dataset.ms]); g.setAttribute("class", "cal " + s); const p = g.querySelector("path");
    const x = +p.dataset.x, w = +p.dataset.w, b = +p.dataset.b, h = s==="yours"||s==="ref" ? 26 : s==="manual" ? 12 : 0;
    p.setAttribute("d", `M${x} ${b} L${x+w*0.25} ${b} L${x+w*0.25} ${b-h} L${x+w*0.72} ${b-h} L${x+w*0.72} ${b} L${x+w} ${b}`); });
  DOMAINS.forEach(d => { const s = domStats(d); root.querySelectorAll(`[data-v="sl-${d.id}"],[data-v="sf-${d.id}"]`).forEach(t => t.textContent = `${s.inn}/${s.of} files · ${s.yours}/${s.msN} measures`); });
  const st = stats(); const flatFams = DOMAINS.filter(d => domStats(d).state!=="full").length;
  root.querySelector('[data-v="rhythm"]').textContent = st.filesIn===0 ? "No signal. Nothing has arrived yet." : flatFams ? `Regular beats on ${10-flatFams} of 10 leads; flat segments on ${flatFams}. ${st.months && st.months<12 ? `Short strip: ${st.months} month${st.months>1?"s":""} recorded.` : ""}` : `Beats on all ten leads.${st.months && st.months<12 ? ` Short strip: ${st.months} month${st.months>1?"s":""} recorded.` : ""}`;
  const note = root.querySelector(".note"), svg = root.querySelector(".strip svg"), first = root.querySelector(".bt:not(.in)");
  if (first && svg.clientWidth){ const sc = svg.clientWidth / this._geo.W, b = first.getBBox(); note.style.left = Math.min(svg.clientWidth-220, (b.x + 6)*sc) + "px"; note.style.top = Math.max(0, (b.y - 2)*sc) + "px"; note.textContent = "flat line: not sent yet"; note.hidden = false; }
  else note.hidden = true;
}});

const PAGE = {"title": "Simulation · page 1 of 8 · Your data · options", "sub": "Four options for the first page. Each is live: drop real CSVs to see it fill. Option B was chosen on 13 Oct 2026.", "only": ["night", "web", "records", "strip"]};
/* ===== review page: option picker ===== */
let CUR = null;
if (PAGE.only) { const keep = PAGE.only.map(k => LOOKS.find(l => l.key === k)).filter(Boolean); LOOKS.length = 0; LOOKS.push(...keep); }
const LSKEY = "simlook:" + PAGE.title;
function mountLook(i){
  CUR = LOOKS[i]; const stage = document.getElementById("stage");
  document.getElementById("lookCss").textContent = CUR.css;
  CUR.mount(stage); refresh(null);
  document.getElementById("rvNote").innerHTML = CUR.note;
  document.querySelectorAll("#picks button").forEach((b,j)=>b.setAttribute("aria-pressed", j===i?"true":"false"));
  try { localStorage.setItem(LSKEY, String(i)); } catch(e) {} window.scrollTo(0,0);
}
function refresh(arrived){
  const root = document.querySelector("#stage .lk"); if (!root) return;
  fillCommon(root); CUR.update(root, arrived);
  if (!chatBody.querySelector(".you")) fillChat();
}
listeners.push(refresh);
document.head.insertAdjacentHTML("beforeend", '<style id="lookCss"></style>');
document.getElementById("picks").innerHTML = LOOKS.map((l,i)=>`<button type="button" data-i="${i}"><b>${PAGE.byPage ? (l.step+1) : l.letter}</b>${esc(PAGE.byPage ? JOURNEY[l.step][0] : l.name)}</button>`).join("");
document.querySelectorAll("#picks button").forEach(b => b.onclick = () => mountLook(+b.dataset.i));
document.getElementById("rvTitle").textContent = PAGE.title; document.getElementById("rvSub").textContent = PAGE.sub;
document.getElementById("picks").hidden = LOOKS.length < 2;
document.querySelector(".rvtools").hidden = PAGE.rvtools === false;
document.querySelectorAll("[data-rv]").forEach(b => b.onclick = () => b.dataset.rv==="sample" ? playSample() : clearAll());
openingState();
let start = 0; try { start = +(localStorage.getItem(LSKEY)||0); } catch(e) {}
const fromHash = LOOKS.findIndex(l => "#"+l.key === location.hash);
mountLook(fromHash>=0 ? fromHash : (start < LOOKS.length ? start : 0));
document.addEventListener("click", e => { const b = e.target.closest("#stage [data-step]"); if (!b || !PAGE.byPage) return; const i = LOOKS.findIndex(l => l.step === +b.dataset.step); if (i >= 0 && LOOKS[i] !== CUR) mountLook(i); });

</script>
