<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virevo — Dependency Dashboard</title>

  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/analysis.css">

  <style>
    /* ─── DEPENDENCY DASHBOARD SCOPED STYLES ─────────────────────────────── */
    .dep-dash-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:100vh}
    .dep-dash-top{background:var(--bg-card);border-bottom:1px solid var(--border);padding:18px 28px;flex-shrink:0}
    .dep-dash-top h2{font-size:18px;font-weight:700;color:var(--text-primary);margin-bottom:6px}
    .dep-dash-summary{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
    .dep-summ-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;background:var(--bg-card-hover);border:1px solid var(--border);color:var(--text-secondary)}
    .dep-summ-pill b{color:var(--text-primary)}
    .dep-dash-body{flex:1;overflow-y:auto;padding:24px 28px}
    .dep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:20px;margin-bottom:24px}
    /* Person Card */
    .dep-person-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color 0.2s,box-shadow 0.2s}
    .dep-person-card:hover{border-color:var(--green-light);box-shadow:0 4px 24px rgba(42,140,72,0.1)}
    .dep-card-hdr{padding:16px 18px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
    .dep-card-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;border:2px solid var(--border)}
    .dep-card-name{font-size:15px;font-weight:700;color:var(--text-primary)}
    .dep-card-role{font-size:11px;color:var(--text-muted);margin-top:2px}
    .dep-card-contact{font-size:11px;color:var(--text-secondary);margin-top:2px}
    .dep-card-body{padding:14px 18px}
    /* Stat Row */
    .dep-stat-row{display:flex;gap:8px;margin-bottom:14px}
    .dep-stat-box{flex:1;text-align:center;padding:8px 4px;border-radius:8px;background:var(--bg-deep);border:1px solid var(--border)}
    .dep-stat-num{font-size:18px;font-weight:800}
    .dep-stat-lbl{font-size:10px;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.04em}
    .done-color{color:var(--green-light)} .active-color{color:var(--gold)} .pending-color{color:var(--text-muted)} .delayed-color{color:var(--danger)}
    /* Donut Chart */
    .dep-donut-wrap{display:flex;align-items:center;gap:16px;margin-bottom:14px}
    .dep-donut{position:relative;width:80px;height:80px;flex-shrink:0}
    .dep-donut svg{width:80px;height:80px;transform:rotate(-90deg)}
    .dep-donut-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--text-primary)}
    .dep-donut-legend{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--text-secondary)}
    .dep-legend-item{display:flex;align-items:center;gap:5px}
    .dep-legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    /* Bar Chart */
    .dep-bar-section{margin-bottom:12px}
    .dep-bar-title{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px}
    .dep-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
    .dep-bar-label{font-size:11px;color:var(--text-secondary);width:80px;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .dep-bar-track{flex:1;height:14px;background:var(--bg-deep);border-radius:7px;overflow:hidden;position:relative}
    .dep-bar-fill{height:100%;border-radius:7px;transition:width 0.5s}
    .dep-bar-val{font-size:10px;font-weight:700;color:var(--text-muted);width:32px;text-align:right;flex-shrink:0}
    /* Progress Bar */
    .dep-progress-bar{margin-bottom:14px}
    .dep-progress-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
    .dep-progress-name{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em}
    .dep-progress-pct{font-size:13px;font-weight:800;color:var(--green-light)}
    .dep-progress-track{height:8px;background:var(--bg-deep);border-radius:4px;overflow:hidden}
    .dep-progress-fill{height:100%;border-radius:4px;background:linear-gradient(135deg,var(--green-primary),var(--green-light));transition:width 0.5s}
    /* KPI Impact Mini Cards */
    .dep-kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:10px}
    .dep-kpi-mini{padding:6px 8px;border-radius:8px;background:var(--bg-deep);border:1px solid var(--border)}
    .dep-kpi-mini-name{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .dep-kpi-mini-val{font-size:14px;font-weight:800;color:var(--text-primary)}
    .dep-kpi-mini-delta{font-size:10px;font-weight:700;margin-left:4px}
    /* Timeline mini */
    .dep-tl-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--text-muted);margin-top:2px}
    /* Action bar */
    .dash-action-bar{position:sticky;bottom:0;background:var(--bg-card);border-top:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:14px;z-index:50;justify-content:flex-end}
    .dash-action-bar .info-text{font-size:12px;color:var(--text-muted);flex:1}
    .dash-action-bar .btn{white-space:nowrap;flex-shrink:0;width:auto!important}
    /* Buttons */
    .btn-outline{background:transparent;color:var(--text-secondary);border:1px solid var(--border);padding:6px 14px;border-radius:6px;font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s}
    .btn-outline:hover{border-color:var(--green-light);color:var(--green-light)}
    /* No data state */
    .no-data{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;color:var(--text-muted)}
    .no-data h2{font-size:20px;font-weight:700;color:var(--text-primary);margin-bottom:8px}
    .no-data p{font-size:14px;margin-bottom:20px}

    @media(max-width:600px){
      .dep-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>

  <!-- ═══════════ AMBIENT BACKGROUND ═══════════ -->
  <div class="ambient"></div>
  <div class="particles" id="particles"></div>

  <!-- ═══════════ ANALYSIS LAYOUT ═══════════ -->
  <div class="analysis-layout">

    <!-- ── Left Sidebar (Icons Only) ── -->
    <div class="analysis-sidebar">
      <div class="sidebar-logo-mini">
        <img src="images/Tojo_Namaste.png" alt="Tojo">
      </div>

      <div class="sidebar-nav-mini">
        <a href="index.html" class="nav-icon" id="homeNavBtn" title="Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </a>
        <a href="simulation.html" class="nav-icon" title="Simulation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </a>
        <a href="dashboard.html" class="nav-icon active" title="Dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5"/>
          </svg>
        </a>
        <a href="analysis.html" class="nav-icon" title="Analysis">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M21 21H4.6C4.03995 21 3.75992 21 3.54601 20.891C3.35785 20.7951 3.20487 20.6422 3.10899 20.454C3 20.2401 3 19.9601 3 19.4V3"/>
            <path d="M7 14l4-4 4 4 6-6"/>
          </svg>
        </a>
      </div>

      <div class="sidebar-bottom">
        <div class="nav-icon" id="settingsBtn" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- ── Main Area ── -->
    <div class="analysis-main">

      <!-- ── Top Bar ── -->
      <div class="analysis-topbar">
        <div class="analysis-title">Dependency <span>Dashboard</span></div>

        <div style="display: flex; align-items: center; gap: 12px;">
          <div class="theme-wrapper" id="themeWrapper">
            <button class="theme-btn" id="themeBtn" title="Change theme">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="5"/>
                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
              </svg>
            </button>
            <div class="theme-dropdown" id="themeDropdown">
              <div class="theme-dd-header">Appearance</div>
              <div class="theme-option active" data-theme="dark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                Dark
              </div>
              <div class="theme-option" data-theme="light">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                Light
              </div>
              <div class="theme-option" data-theme="corporate">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>

      </div>

      <!-- ── Content ── -->
      <div class="analysis-content" id="analysisContent">
        <div class="dep-dash-wrap">
          <div class="dep-dash-top">
            <h2 id="depDashTitle">Dependency Dashboard — All Assignees</h2>
            <div class="dep-dash-summary" id="depDashSummary"></div>
          </div>
          <div class="dep-dash-body" id="depDashBody">
            <!-- Populated by JS -->
          </div>
          <div class="dash-action-bar">
            <div class="info-text">Overview of all department heads and their implementation progress</div>
            <button class="btn-outline" onclick="window.location.href='simulation.html'">← Back to Implementation Dashboard</button>
          </div>
        </div>
      </div>

    </div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════════════
// THEME MANAGEMENT (mirrors simulation_layout.js)
// ═══════════════════════════════════════════════════════════════════════════
(function initTheme() {
  const saved = localStorage.getItem('virevo-theme');
  if (saved) {
    document.documentElement.setAttribute('data-theme', saved);
    document.querySelectorAll('.theme-option').forEach(opt => {
      opt.classList.toggle('active', opt.dataset.theme === saved);
    });
  }

  const themeBtn = document.getElementById('themeBtn');
  const dropdown = document.getElementById('themeDropdown');
  if (themeBtn && dropdown) {
    themeBtn.addEventListener('click', () => dropdown.classList.toggle('open'));
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.theme-wrapper')) dropdown.classList.remove('open');
    });
    dropdown.querySelectorAll('.theme-option').forEach(opt => {
      opt.addEventListener('click', () => {
        const theme = opt.dataset.theme;
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('virevo-theme', theme);
        dropdown.querySelectorAll('.theme-option').forEach(o => o.classList.remove('active'));
        opt.classList.add('active');
        dropdown.classList.remove('open');
      });
    });
  }
})();

// ═══════════════════════════════════════════════════════════════════════════
// SESSION CHECK — Redirect to login if not authenticated
// ═══════════════════════════════════════════════════════════════════════════
(function checkSession() {
  try {
    const session = JSON.parse(sessionStorage.getItem('virevo-session') || '{}');
    if (!session.loggedIn) {
      // Allow viewing if dashboard data exists (may have been saved before session expired)
      const dashData = localStorage.getItem('virevo-dep-dashboard');
      if (!dashData) {
        window.location.href = 'index.html';
        return;
      }
    }
  } catch(e) {
    // If no session and no data, redirect
    if (!localStorage.getItem('virevo-dep-dashboard')) {
      window.location.href = 'index.html';
    }
  }
})();

// ═══════════════════════════════════════════════════════════════════════════
// RENDER DEPENDENCY DASHBOARD FROM LOCALSTORAGE
// ═══════════════════════════════════════════════════════════════════════════
const fmt1 = v => (Math.round(v*10)/10).toFixed(1);

function renderDashboard() {
  const raw = localStorage.getItem('virevo-dep-dashboard');
  if (!raw) {
    document.getElementById('depDashBody').innerHTML = `
      <div class="no-data">
        <h2>No Dashboard Data Available</h2>
        <p>Run the simulation in the Simulation Engine first, then click "Dependency Dashboard" to generate this view.</p>
        <button class="btn-outline" onclick="window.location.href='simulation.html'" style="padding:10px 24px;font-size:14px">
          → Go to Simulation
        </button>
      </div>`;
    return;
  }

  const D = JSON.parse(raw);
  const deptContacts = D.deptContacts || {};
  const deptInfo = D.deptInfo || {};
  const taskStatus = D.taskStatus || {};
  const scaledTasks = D.scaledTasks || [];
  const neededDepts = new Set(D.neededDepts || []);
  const selectedTargets = D.selectedTargets || [];
  const baselineResult = D.baselineResult || {};
  const currentResult = D.currentResult || {};
  const influence = D.influence || {};
  const allTargets = D.allTargets || [];
  const ps = D.projectSummary || {};

  const orderedDepts = ['owner', ...Object.keys(deptInfo).filter(d => d !== 'owner' && neededDepts.has(d))];

  // Summary
  const totalTasks = scaledTasks.length;
  const totalDone = scaledTasks.filter(t => taskStatus[t.key] === 'done').length;
  const totalActive = scaledTasks.filter(t => taskStatus[t.key] === 'inprogress').length;
  const totalDelayed = scaledTasks.filter(t => taskStatus[t.key] === 'delayed').length;
  const totalPending = totalTasks - totalDone - totalActive - totalDelayed;
  const overallPct = totalTasks > 0 ? Math.round(totalDone / totalTasks * 100) : 0;

  const summaryEl = document.getElementById('depDashSummary');
  if (summaryEl) summaryEl.innerHTML = `
    <div class="dep-summ-pill"><b>${orderedDepts.filter(d => neededDepts.has(d)).length}</b> Assignees</div>
    <div class="dep-summ-pill"><b>${totalTasks}</b> Total Tasks</div>
    <div class="dep-summ-pill" style="color:var(--green-light)"><b>${totalDone}</b> Done</div>
    <div class="dep-summ-pill" style="color:var(--gold)"><b>${totalActive}</b> Active</div>
    <div class="dep-summ-pill" style="color:var(--text-muted)"><b>${totalPending}</b> Pending</div>
    <div class="dep-summ-pill" style="color:var(--danger)"><b>${totalDelayed}</b> Delayed</div>
    <div class="dep-summ-pill">Overall: <b>${overallPct}%</b></div>`;

  // Update title with session user
  const session = JSON.parse(sessionStorage.getItem('virevo-session') || '{}');
  const ownerName = deptContacts.owner?.name || session.name || 'Owner';
  document.getElementById('depDashTitle').textContent = `Dependency Dashboard — ${ownerName}`;

  let html = '<div class="dep-grid">';

  orderedDepts.forEach(deptId => {
    if (!neededDepts.has(deptId)) return;
    const di = deptInfo[deptId] || {label: deptId, icon: '🏛️', color: '#888'};
    const contacts = deptContacts[deptId] || {};
    const personName = contacts.name || di.label;
    const personPhone = contacts.phone || '';
    const personEmail = contacts.email || '';
    const deptTasks = scaledTasks.filter(t => t.allDepts.includes(deptId));
    if (deptTasks.length === 0) return;

    const done = deptTasks.filter(t => taskStatus[t.key] === 'done').length;
    const active = deptTasks.filter(t => taskStatus[t.key] === 'inprogress').length;
    const delayed = deptTasks.filter(t => taskStatus[t.key] === 'delayed').length;
    const pending = deptTasks.length - done - active - delayed;
    const pct = deptTasks.length > 0 ? Math.round(done / deptTasks.length * 100) : 0;

    // Donut chart SVG
    const donutR = 32, donutC = 2 * Math.PI * donutR;
    const total = deptTasks.length || 1;
    const segments = [
      {count: done, color: 'var(--green-light)', label: 'Done'},
      {count: active, color: 'var(--gold)', label: 'Active'},
      {count: pending, color: 'var(--text-muted)', label: 'Pending'},
      {count: delayed, color: 'var(--danger)', label: 'Delayed'},
    ];
    let donutSvg = '', offset = 0;
    segments.forEach(seg => {
      if (seg.count === 0) return;
      const len = (seg.count / total) * donutC;
      donutSvg += `<circle cx="40" cy="40" r="${donutR}" fill="none" stroke="${seg.color}" stroke-width="12" stroke-dasharray="${len} ${donutC - len}" stroke-dashoffset="${-offset}" stroke-linecap="round"/>`;
      offset += len;
    });
    const donutLegend = segments.filter(s => s.count > 0).map(s =>
      `<div class="dep-legend-item"><div class="dep-legend-dot" style="background:${s.color}"></div>${s.label}: <b>${s.count}</b></div>`
    ).join('');

    // Bar chart — group tasks by paramName (intervention)
    const byParam = {};
    deptTasks.forEach(t => { if (!byParam[t.paramName]) byParam[t.paramName] = 0; byParam[t.paramName]++; });
    const paramEntries = Object.entries(byParam).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const maxBar = Math.max(...paramEntries.map(([, c]) => c), 1);
    const barColors = ['var(--green-light)', 'var(--gold)', 'var(--green-primary)', 'var(--danger)', 'var(--text-secondary)'];
    const barRows = paramEntries.map(([name, count], i) => {
      const w = Math.round(count / maxBar * 100);
      const shortName = name.length > 14 ? name.slice(0, 13) + '…' : name;
      return `<div class="dep-bar-row"><div class="dep-bar-label" title="${name}">${shortName}</div><div class="dep-bar-track"><div class="dep-bar-fill" style="width:${w}%;background:${barColors[i % barColors.length]}"></div></div><div class="dep-bar-val">${count}</div></div>`;
    }).join('');

    // KPI impact
    const kpiSet = new Set();
    deptTasks.forEach(t => {
      const inf = influence[t.paramId];
      if (inf) Object.keys(inf).forEach(k => { if (selectedTargets.includes(k)) kpiSet.add(k); });
    });
    const kpiMinis = [...kpiSet].slice(0, 4).map(kpiId => {
      const meta = allTargets.find(t => t.id === kpiId) || {name: kpiId, unit: ''};
      const baseline = baselineResult[kpiId] ?? 0;
      const current = currentResult[kpiId] ?? baseline;
      const delta = current - baseline;
      const isPos = delta >= 0;
      return `<div class="dep-kpi-mini"><div class="dep-kpi-mini-name">${meta.name}</div><div class="dep-kpi-mini-val">${fmt1(current)}<span class="dep-kpi-mini-delta" style="color:${isPos ? 'var(--green-light)' : 'var(--danger)'}">${isPos ? '+' : ''}${fmt1(delta)}</span></div></div>`;
    }).join('');

    // Timeline segments
    const minWk = Math.min(...deptTasks.map(t => t.wkStart));
    const maxWk = Math.max(...deptTasks.map(t => t.wkEnd));
    const totalWks = maxWk - minWk || 1;
    const tlSegments = deptTasks.map(t => {
      const st = taskStatus[t.key] || 'pending';
      const colors = {done: 'var(--green-light)', inprogress: 'var(--gold)', pending: 'var(--bg-card-hover)', delayed: 'var(--danger)'};
      const left = ((t.wkStart - minWk) / totalWks * 100);
      const w = Math.max(2, ((t.wkEnd - t.wkStart) / totalWks * 100));
      return `<div style="position:absolute;left:${left}%;width:${w}%;height:6px;border-radius:3px;background:${colors[st] || colors.pending}"></div>`;
    }).join('');

    const contactLine = [personPhone, personEmail].filter(Boolean).join(' · ') || 'No contact set';

    html += `<div class="dep-person-card">
      <div class="dep-card-hdr">
        <div class="dep-card-avatar" style="background:${di.color}22;border-color:${di.color};color:${di.color}">${di.icon}</div>
        <div>
          <div class="dep-card-name">${personName}</div>
          <div class="dep-card-role">${di.label}</div>
          <div class="dep-card-contact">${contactLine}</div>
        </div>
      </div>
      <div class="dep-card-body">
        <div class="dep-stat-row">
          <div class="dep-stat-box"><div class="dep-stat-num done-color">${done}</div><div class="dep-stat-lbl">Done</div></div>
          <div class="dep-stat-box"><div class="dep-stat-num active-color">${active}</div><div class="dep-stat-lbl">Active</div></div>
          <div class="dep-stat-box"><div class="dep-stat-num pending-color">${pending}</div><div class="dep-stat-lbl">Pending</div></div>
          <div class="dep-stat-box"><div class="dep-stat-num delayed-color">${delayed}</div><div class="dep-stat-lbl">Delayed</div></div>
        </div>
        <div class="dep-donut-wrap">
          <div class="dep-donut">
            <svg viewBox="0 0 80 80">${donutSvg}</svg>
            <div class="dep-donut-center">${pct}%</div>
          </div>
          <div class="dep-donut-legend">${donutLegend}</div>
        </div>
        <div class="dep-progress-bar">
          <div class="dep-progress-label"><span class="dep-progress-name">Overall Completion</span><span class="dep-progress-pct">${pct}%</span></div>
          <div class="dep-progress-track"><div class="dep-progress-fill" style="width:${pct}%"></div></div>
        </div>
        ${paramEntries.length > 0 ? `<div class="dep-bar-section"><div class="dep-bar-title">Tasks by Intervention</div>${barRows}</div>` : ''}
        ${kpiMinis ? `<div class="dep-bar-title" style="margin-bottom:6px">KPI Impact</div><div class="dep-kpi-grid">${kpiMinis}</div>` : ''}
        <div class="dep-bar-title" style="margin-bottom:4px">Timeline Span</div>
        <div style="position:relative;height:6px;background:var(--bg-deep);border-radius:3px;overflow:hidden">${tlSegments}</div>
        <div class="dep-tl-labels"><span>Wk ${minWk + 1}</span><span>Wk ${maxWk}</span></div>
      </div>
    </div>`;
  });

  html += '</div>';
  document.getElementById('depDashBody').innerHTML = html;
}

// Render on load
document.addEventListener('DOMContentLoaded', renderDashboard);
</script>

</body>
</html>
