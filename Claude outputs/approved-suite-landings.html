<title>Approved Suite Landings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@500;700&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: a neutral review strip on top, then one full-bleed suite landing at a time.
   Each scheme commits to its own single look (no light/dark swap by design); every colour is set explicitly. */
:root{
  --f-num:"Bebas Neue","Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"Poppins","Segoe UI",system-ui,sans-serif;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --rv-bg:#F4F4F2; --rv-ink:#1D1F22; --rv-mute:#5E636A; --rv-line:#D9DADC;
  --forest:#10241a; --forest2:#17321f; --cream:#F3EFE3; --gold:#d4a94f;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--rv-bg);color:var(--rv-ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #F2B705;outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- review strip (not part of the design) ---------- */
.rv{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;border-bottom:1px solid var(--rv-line);background:var(--rv-bg)}
.rv h1{font-family:var(--f-num);font-weight:400;font-size:26px;letter-spacing:.02em;margin:0;line-height:1}
.rv small{display:block;color:var(--rv-mute);font-size:12px}
.rv .picks{display:flex;flex-wrap:wrap;gap:6px}
.rv .picks button{border:1.5px solid var(--rv-line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;min-height:40px}
.rv .picks button b{font-family:var(--f-num);font-weight:400;font-size:17px;margin-right:6px;letter-spacing:.03em}
.rv .picks button[aria-pressed="true"]{background:var(--rv-ink);color:#fff;border-color:var(--rv-ink)}
.rv .uni{margin-left:auto;border:1.5px dashed var(--rv-ink);background:transparent;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;min-height:40px}
.rv-note{padding:8px 16px;font-size:12.5px;color:var(--rv-mute);border-bottom:1px solid var(--rv-line);background:#fff}
.rv-note b{color:var(--rv-ink)}
#stage{transition:margin-right .3s ease;min-height:80vh}
body.chat-open #stage{margin-right:400px}
@media (max-width:900px){ body.chat-open #stage{margin-right:0} .rv .uni{margin-left:0} }

/* ---------- hover peek (universal) ---------- */
#peek{position:fixed;z-index:60;max-width:300px;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;
  background:var(--pk-bg,#111);color:var(--pk-fg,#fff);border:1px solid var(--pk-line,#333);border-radius:var(--pk-r,10px);padding:10px 12px;font-size:12.5px;line-height:1.45;box-shadow:0 12px 30px rgba(0,0,0,.25)}
#peek.on{opacity:1;transform:none;pointer-events:auto}
#peek{max-width:320px}
#peek .pk-bar{display:flex;gap:6px;align-items:center;margin:-2px -4px 8px;padding-bottom:8px;border-bottom:1px solid var(--pk-line)}
.pk-ask{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--gold);background:var(--forest);color:var(--cream);border-radius:999px;padding:4px 12px 4px 4px;font-size:12px;font-weight:600;min-height:34px}
.pk-ask i{width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--forest);display:grid;place-items:center;font-style:normal;font-family:var(--f-num);font-size:15px}
.pk-x{margin-left:auto;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--pk-line);background:transparent;color:inherit;font-size:17px;line-height:1}
#peek .pk-t{font-weight:600;font-size:13px;margin-bottom:2px}
#peek .pk-n{font-family:var(--f-num);font-size:26px;line-height:1;letter-spacing:.02em}
#peek .pk-m{opacity:.78}
#peek .pk-hint{margin-top:6px;font-size:11px;opacity:.6}

/* ---------- detail sheet (expanded item) ---------- */
#scrim{position:fixed;inset:0;background:rgba(10,12,14,.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;z-index:71;left:50%;bottom:0;transform:translate(-50%,105%);width:min(780px,100%);max-height:86vh;overflow:auto;
  background:var(--sh-bg,#fff);color:var(--sh-fg,#111);border-radius:var(--sh-r,18px) var(--sh-r,18px) 0 0;padding:22px 22px calc(26px + env(safe-area-inset-bottom,0px));
  transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;visibility:hidden;border:1px solid var(--sh-line,#ddd);border-bottom:0;font-family:var(--f-body)}
#sheet.on{transform:translate(-50%,0);visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sheet .shbar{position:sticky;top:-22px;z-index:2;display:flex;justify-content:flex-end;gap:10px;margin:-22px -22px 6px;padding:12px 16px;background:var(--sh-bg);border-bottom:1px solid var(--sh-line)}
#sheet .x{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--sh-line);background:var(--sh-bg);color:var(--sh-fg);font-size:20px;line-height:1}
#sheet .sh-ask{display:inline-flex;align-items:center;gap:9px;border:2px solid var(--gold);background:var(--forest);color:var(--cream);border-radius:999px;padding:5px 16px 5px 5px;font-size:14px;font-weight:600;min-height:44px}
#sheet .sh-ask i{width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--forest);display:grid;place-items:center;font-style:normal;font-family:var(--f-num);font-size:20px}
body.chat-open #sheet{left:calc((100% - 400px)/2);width:min(780px,calc(100% - 420px))}
body.chat-open #chat{z-index:75}
body.chat-open #peek{z-index:80}
.d-eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--sh-mute)}
.d-title{font-family:var(--f-num);font-weight:400;font-size:38px;line-height:1;margin:4px 0 6px;letter-spacing:.01em;text-wrap:balance}
.d-sub{color:var(--sh-mute);margin:0 0 14px}
.d-pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;border:1.5px solid currentColor}
.d-pill.ahead{color:var(--c-ok)} .d-pill.watch{color:var(--c-warn)} .d-pill.off{color:var(--c-bad)}
.d-pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.d-four{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.d-four div{border:1px solid var(--sh-line);border-radius:10px;padding:10px;background:var(--sh-card)}
.d-four span{display:block;font-size:11.5px;color:var(--sh-mute);font-weight:600}
.d-four b{font-family:var(--f-num);font-weight:400;font-size:26px;line-height:1.1;letter-spacing:.02em}
.d-four .now b{color:var(--sh-state)}
.d-glide{position:relative;height:46px;margin:6px 4px 18px}
.d-glide .rail{position:absolute;left:0;right:0;top:20px;height:6px;border-radius:3px;background:var(--sh-line)}
.d-glide .fill{position:absolute;left:0;top:20px;height:6px;border-radius:3px;background:var(--sh-state)}
.d-glide .mk{position:absolute;top:8px;width:2px;height:30px;background:var(--sh-fg);transform:translateX(-1px)}
.d-glide .mk.plan{background:none;border-left:2px dashed var(--sh-mute)}
.d-glide .mk i{position:absolute;top:32px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;white-space:nowrap;color:var(--sh-mute)}
.d-sec{margin-top:16px}
.d-sec h4{margin:0 0 8px;font-size:13px;font-weight:600}
.d-fac{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:6px 12px;align-items:center;font-size:13.5px}
.d-fac .bar{display:block;height:8px;border-radius:4px;background:var(--sh-line);overflow:hidden}
.d-fac .bar i{display:block;height:100%;background:var(--c-bad)}
.d-fix{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.d-fix li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;border:1px solid var(--sh-line);border-radius:10px;padding:9px 10px;background:var(--sh-card);font-size:13.5px}
.d-fix .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--sh-fg);color:var(--sh-bg)}
.d-fix time{font-size:12px;font-weight:600;color:var(--sh-mute);white-space:nowrap}
.d-back{margin-top:12px;font-family:var(--f-hand);font-weight:700;font-size:24px;color:var(--sh-state)}
.d-list{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.d-list li{display:flex;gap:10px;align-items:baseline;font-size:13.5px}
.d-list .ck{flex:0 0 18px;height:18px;border-radius:5px;border:2px solid var(--sh-fg);display:grid;place-items:center;font-size:11px;font-weight:700}
.d-list .ck.y{background:var(--sh-fg);color:var(--sh-bg)}
.d-list .ck.late{border-color:var(--c-bad);color:var(--c-bad)}
.d-list em{font-style:normal;font-size:12px;font-weight:600;color:var(--sh-mute);margin-left:auto;white-space:nowrap}
.d-list em.late{color:var(--c-bad)}
.d-impact{border-left:4px solid var(--c-bad);padding:8px 12px;background:var(--sh-card);border-radius:0 10px 10px 0;font-size:13.5px}
.d-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.d-grid div{border:1px solid var(--sh-line);border-radius:10px;padding:10px;background:var(--sh-card)}
.d-grid span{font-size:11.5px;color:var(--sh-mute);font-weight:600;display:block}
.d-grid b{font-size:14px}
.d-money{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.d-money th,.d-money td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--sh-line)}
.d-money th:first-child,.d-money td:first-child{text-align:left}
.d-money tfoot td{font-weight:700}
.d-wrap{overflow-x:auto}
.d-uni{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.d-uni div{border:1px solid var(--sh-line);border-radius:12px;padding:12px;background:var(--sh-card)}
.d-uni b{display:block;font-size:14px;margin-bottom:3px}
.d-uni p{margin:0;font-size:13px;color:var(--sh-mute)}
@media (max-width:600px){ .d-four{grid-template-columns:repeat(2,1fr)} .d-fac{grid-template-columns:minmax(0,1fr) 72px} .d-title{font-size:32px} }

/* ---------- chat (same look as the tools) ---------- */
#chatFab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:10px;
  background:var(--forest);color:var(--cream);border:2px solid var(--gold);border-radius:999px;padding:8px 18px 8px 8px;min-height:56px;box-shadow:0 10px 24px rgba(0,0,0,.28)}
#chatFab .t{width:40px;height:40px;border-radius:50%;background:var(--gold);color:var(--forest);display:grid;place-items:center;font-family:var(--f-num);font-size:24px}
#chatFab span{font-weight:600;font-size:14px}
#chatFab .dot{position:absolute;top:6px;left:40px;width:12px;height:12px;border-radius:50%;background:#E5484D;border:2px solid var(--forest)}
body.chat-open #chatFab{display:none}
#chat{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:100%;z-index:55;background:var(--forest);color:var(--cream);transform:translateX(102%);transition:transform .3s ease;visibility:hidden;display:flex;flex-direction:column;border-radius:20px 0 0 20px}
body.chat-open #chat{transform:none;visibility:visible}
#chat header{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid rgba(243,239,227,.12)}
#chat header .t{width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--forest);display:grid;place-items:center;font-family:var(--f-num);font-size:26px}
#chat header h3{margin:0;font-family:var(--f-num);font-weight:400;font-size:26px;letter-spacing:.03em;line-height:1}
#chat header small{display:block;font-size:12px;opacity:.75}
#chat header button{margin-left:auto;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(243,239,227,.3);background:transparent;color:var(--cream);font-size:18px}
#chat .body{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
#chat .msg{background:var(--cream);color:var(--forest);border-radius:14px;padding:12px 14px;font-size:14px}
#chat .msg p{margin:0 0 8px} #chat .msg p:last-child{margin:0}
#chat .lbl{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;opacity:.75}
#chat .note{font-family:var(--f-hand);font-weight:700;font-size:31px;line-height:1.08;color:var(--gold)}
#chat .pt{display:flex;gap:10px;align-items:center;border:1px solid rgba(243,239,227,.22);border-radius:10px;padding:9px 10px;background:transparent;color:var(--cream);text-align:left;font-size:13.5px;min-height:44px}
#chat .pt b{border:1px solid rgba(243,239,227,.35);border-radius:6px;padding:2px 6px;font-size:11.5px}
#chat .pt[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
#chat .ask{border:1.5px dashed rgba(212,169,79,.7);border-radius:16px;padding:9px 14px;background:transparent;color:var(--cream);text-align:left;font-size:13.5px;display:flex;justify-content:space-between;gap:8px;min-height:44px}
#chat .ask::after{content:"→";color:var(--gold)}
#chat .ctx{margin:0 18px;padding:10px 12px;border:1.5px solid var(--gold);border-bottom:0;border-radius:12px 12px 0 0;background:rgba(212,169,79,.1);display:flex;gap:10px;align-items:flex-start}
#chat .ctx div{flex:1;min-width:0;font-size:12.5px}
#chat .ctx span{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600}
#chat .ctx b{display:block;font-size:13.5px}
#chat .ctx small{display:block;opacity:.8;font-size:12px}
#chat .ctx button{width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(243,239,227,.35);background:transparent;color:var(--cream);font-size:16px}
#chat .ctx:not([hidden]) + .in{border-top:0;padding-top:8px}
#chat .you{align-self:flex-end;max-width:88%;background:rgba(243,239,227,.1);border:1px solid rgba(243,239,227,.22);border-radius:14px 14px 4px 14px;padding:10px 12px;font-size:13.5px}
#chat .you p{margin:0}
#chat .att{border-left:3px solid var(--gold);padding:2px 8px;margin-bottom:6px;font-size:12px}
#chat .att span{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600}
#chat .msg ul{margin:0 0 8px;padding-left:18px} #chat .msg li{margin:2px 0}
#chat .typing{display:flex;gap:5px;padding:6px 2px}
#chat .typing i{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:tdot 1s infinite}
#chat .typing i:nth-child(2){animation-delay:.15s} #chat .typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,100%{opacity:.25}50%{opacity:1}}
#chat .in{padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(243,239,227,.12);display:flex;gap:10px;align-items:flex-end}
#chat textarea{flex:1;min-height:96px;resize:none;border-radius:12px;border:0;background:var(--cream);color:var(--forest);padding:10px 12px;font:inherit;font-size:14px}
#chat .send{width:48px;height:48px;border-radius:50%;border:0;background:var(--gold);color:var(--forest);font-size:20px;font-weight:700}
@media (max-width:600px){ #chat{width:100%;border-radius:0} #chatFab span{display:none} #chatFab{padding:8px} }

.flash{animation:flash 1.4s ease}
@keyframes flash{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 4px #F2B705}}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>

<div class="rv">
  <div><h1 id="rvTitle"></h1><small id="rvSub"></small></div>
  <div class="picks" id="picks" role="group" aria-label="Choose a scheme"></div>
  <button class="uni" id="uniBtn" type="button">The universal elements</button>
</div>
<div class="rv-note" id="rvNote"></div>
<main id="stage"></main>

<div id="peek" role="status" aria-live="polite"></div>
<div id="scrim"></div>
<section id="sheet" role="dialog" aria-modal="true" aria-label="Details"><div class="shbar"><button class="sh-ask" type="button"><i>T</i>Ask Tojo about this</button><button class="x" type="button" aria-label="Close">×</button></div><div id="sheetBody"></div></section>

<button id="chatFab" type="button" aria-label="Open the chat with Tojo"><i class="t">T</i><span>Ask Tojo</span><i class="dot" aria-hidden="true"></i></button>
<aside id="chat" aria-label="Chat with Tojo">
  <header><i class="t">T</i><div><h3>Tojo</h3><small id="chatSub"></small></div><button type="button" id="chatClose" aria-label="Minimise the chat">–</button></header>
  <div class="body" id="chatBody"></div>
  <div class="ctx" id="chatCtx" hidden></div>
  <div class="in"><label class="sr" for="chatIn">Write to Tojo</label><textarea id="chatIn" placeholder="Write to Tojo…"></textarea><button class="send" type="button" aria-label="Send">→</button></div>
</aside>

function prog(k, v){ return Math.max(0, Math.min(1.15, (v - k.base) / (k.target - k.base))); }
function kstate(k){ const d = prog(k,k.now) - prog(k,k.plan); return d >= 0 ? "ahead" : d > -0.1 ? "watch" : "off"; }
function fmtv(k, v){ if (k.unit === "%") return v + "%"; if (k.unit === "h") return v + " hours"; const h = Math.floor(v/60), m = v%60; return h ? (m ? `${h} h ${m} min` : `${h} h`) : `${m} min`; }
function gapText(k){ const raw = Math.abs(k.now - k.plan); const g = Math.round(raw*10)/10; const amt = k.unit==="%" ? `${g} point${g===1?"":"s"}` : fmtv(k,g);
  if (k.state === "ahead") return `${amt} ahead of plan`; return k.dir==="down" ? `${amt} over plan` : `${amt} under plan`; }
const STATE_WORD = { ahead:"On track", watch:"Slightly behind", off:"Off track" };
const PART_WORD = { live:"Live", testing:"Testing", building:"Being built", blocked:"Late", notstarted:"Not started" };
function pstate(p){ const r = p.done / p.due; return p.late >= 2 || r < 0.6 ? "off" : p.late ? "watch" : "ahead"; }

const L = v => "₹" + (Math.round(v*10)/10).toLocaleString("en-IN") + " lakh";

  P = Object.fromEntries(D.people.map(p => [p.key, p])); KP = Object.fromEntries(D.kpis.map(k => [k.id, k]));
  D.kpis.forEach(k => k.state = kstate(k)); D.people.forEach(p => p.state = pstate(p));
  spendTotal = Math.round(sum(D.spend.map(s=>sum(s.v)))*100)/100; ebitdaTotal = Math.round(sum(D.ebitda)*100)/100; revTotal = Math.round(sum(D.revenue)*100)/100;
  onCourse = D.kpis.filter(k=>k.state!=="off").length;

/* peek: stays open while the pointer is on it, so its buttons can be used */
const peek = document.getElementById("peek"); let peekT, hideT, peekRef = null;
function showPeek(el){ suiteOf(el); const ref = el.dataset.ref; const h = ref && peekFor(ref); if (!h) return; clearTimeout(hideT); peekRef = ref;
  peek.innerHTML = `<div class="pk-bar"><button type="button" class="pk-ask" data-ask="${ref}"><i>T</i>Ask Tojo about this</button><button type="button" class="pk-x" aria-label="Close">×</button></div>${h}`;
  peek.classList.add("on");
  const r = el.getBoundingClientRect(); const pw = peek.offsetWidth, ph = peek.offsetHeight;
  let x = r.left + r.width/2 - pw/2; x = Math.max(8, Math.min(innerWidth - pw - 8 - (document.body.classList.contains("chat-open") && innerWidth > 900 ? 400 : 0), x));
  let y = r.top - ph - 8; if (y < 8) y = r.bottom + 8; peek.style.left = x+"px"; peek.style.top = y+"px"; }
function hidePeek(){ clearTimeout(hideT); peek.classList.remove("on"); peekRef = null; }
function laterHide(ms=260){ clearTimeout(hideT); hideT = setTimeout(()=>{ if (!peek.matches(":hover") && !peek.contains(document.activeElement)) hidePeek(); }, ms); }
document.addEventListener("pointerover", e => { if (e.pointerType==="touch") return; if (peek.contains(e.target)) { clearTimeout(hideT); return; } const el = e.target.closest("#stage [data-ref]"); if (!el) return; clearTimeout(peekT); peekT = setTimeout(()=>showPeek(el), 120); });
document.addEventListener("pointerout", e => { if (e.target.closest("#stage [data-ref]") || peek.contains(e.target)) { clearTimeout(peekT); laterHide(); } });
document.addEventListener("focusin", e => { if (peek.contains(e.target)) { clearTimeout(hideT); return; } const el = e.target.closest("#stage [data-ref]"); if (el) showPeek(el); });
document.addEventListener("focusout", () => laterHide(200));
let pressT; document.addEventListener("touchstart", e => { if (peek.contains(e.target)) return; const el = e.target.closest("#stage [data-ref]"); if (!el) return; pressT = setTimeout(()=>{ showPeek(el); el.dataset.peeked = "1"; }, 380); }, {passive:true});
document.addEventListener("touchend", () => clearTimeout(pressT));
addEventListener("scroll", () => { if (!peek.contains(document.activeElement)) hidePeek(); }, {passive:true});
peek.addEventListener("click", e => { e.stopPropagation(); if (e.target.closest(".pk-x")) return hidePeek(); const a = e.target.closest("[data-ask]"); if (a) { askTojo(a.dataset.ask); hidePeek(); } });

/* small svg helpers */
function linePath(vals, x0, x1, y0, y1, vmin, vmax){ const n = vals.length; return vals.map((v,i)=>{ const x = x0 + (x1-x0)*i/(n-1); const y = y1 - (y1-y0)*(v - vmin)/(vmax - vmin); return (i?"L":"M")+x.toFixed(1)+","+y.toFixed(1); }).join(" "); }
function weekly(k){ /* 11 points, week 0..10, from base to now with gentle wobble */
  const out = []; for (let w=0; w<=D.week; w++){ const t = w/D.week; const ease = t<.3 ? t*.5 : .15 + (t-.3)/.7*.85; let v = k.base + (k.now-k.base)*ease; const wob = Math.sin(w*2.3 + k.id.charCodeAt(1))*Math.abs(k.target-k.base)*0.035*(w>0&&w<D.week?1:0); out.push(v + wob); } return out; }

  render(){
    /* ---- isometric scene ---- */
    const S = 30, OX = 430, OY = 70, C = 0.866, Sn = 0.5;
    const pt = (x,y,z=0) => [OX + (x - y)*C*S, OY + (x + y)*Sn*S - z*S];
    const poly = (pts, fill, extra="") => `<polygon points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="${fill}" ${extra}/>`;
    const box = (x,y,w,d,h,roof,ghost) => {
      const st = ghost ? `stroke="#8E9AAB" stroke-dasharray="4 3" stroke-width="1.2"` : `stroke="#1B2635" stroke-opacity=".18"`;
      const f = ghost ? ["none","none","none"] : ["#FFFFFF","#E4EAF1","#C9D3DF"];
      const top = poly([pt(x,y,h),pt(x+w,y,h),pt(x+w,y+d,h),pt(x,y+d,h)], f[0], st);
      const left = poly([pt(x,y+d,0),pt(x+w,y+d,0),pt(x+w,y+d,h),pt(x,y+d,h)], f[1], st);
      const right = poly([pt(x+w,y,0),pt(x+w,y+d,0),pt(x+w,y+d,h),pt(x+w,y,h)], f[2], st);
      let win = "";
      if (!ghost) { for (let i=0.35;i<w-0.2;i+=0.55) for (let z=0.45; z<h-0.3; z+=0.6) win += poly([pt(x+i,y+d,z),pt(x+i+0.3,y+d,z),pt(x+i+0.3,y+d,z+0.3),pt(x+i,y+d,z+0.3)],"#B7C9DD"); }
      const band = ghost ? "" : poly([pt(x,y,h),pt(x+w,y,h),pt(x+w,y+0.22,h),pt(x,y+0.22,h)], roof);
      return left + right + top + win + band;
    };
    const B = {
      ward:  {x:0.6,y:0.6,w:3.2,d:2.0,h:2.4,roof:"#5B8DEF",label:"Wards"},
      lab:   {x:5.0,y:0.2,w:2.0,d:1.6,h:1.6,roof:"#9B6BDF",label:"Laboratory"},
      radio: {x:8.6,y:0.6,w:2.2,d:2.0,h:1.9,roof:"#E0663A",label:"Radiology"},
      ot:    {x:9.0,y:4.4,w:2.0,d:2.4,h:1.5,roof:"#2AA6A0",label:"Theatres"},
      pharm: {x:8.4,y:8.6,w:2.2,d:1.8,h:1.4,roof:"#E2A72E",label:"Pharmacy"},
      stores:{x:4.6,y:9.4,w:2.4,d:1.6,h:1.2,roof:"#8C6B4F",label:"Stores"},
      nurse: {x:0.6,y:8.6,w:2.2,d:1.8,h:1.3,roof:"#D45A8C",label:"Nursing station"},
      phone: {x:0.8,y:4.6,w:1.4,d:1.4,h:3.0,roof:"#3D4F66",label:"Doctors' phones"},
      engine:{x:4.6,y:4.4,w:2.6,d:2.6,h:4.4,roof:"#1B2635",label:"Summary engine"}
    };
    const order = { live:4, testing:3, building:2, blocked:1, notstarted:0 };
    const pipeCol = { live:"#1B8A4B", testing:"#E09B1A", building:"#8E9AAB", blocked:"#C93A30", notstarted:"#B9C3CF" };
    const ec = [B.engine.x + B.engine.w/2, B.engine.y + B.engine.d/2];
    let pipes = "", builds = "", beacons = "";
    const drawOrder = Object.keys(B).sort((a,b)=>(B[a].x+B[a].w/2+B[a].y+B[a].d/2)-(B[b].x+B[b].w/2+B[b].y+B[b].d/2));
    Object.entries(B).forEach(([k,b]) => { if (k==="engine") return;
      const parts = D.parts.filter(p=>p.dept===k); if (!parts.length) return;
      const best = parts.reduce((a,p)=>order[p.st]>order[a.st]?p:a, parts[0]).st;
      const c = [b.x + b.w/2, b.y + b.d/2]; const a = pt(c[0],c[1],0.15), e = pt(ec[0],ec[1],0.15);
      pipes += `<line x1="${a[0]}" y1="${a[1]}" x2="${e[0]}" y2="${e[1]}" stroke="#1B2635" stroke-opacity=".12" stroke-width="9" stroke-linecap="round"/>`;
      const dash = best==="live" ? `stroke-dasharray="8 4" class="flow"` : best==="testing" ? `stroke-dasharray="8 4" class="flow slow"` : best==="notstarted" ? `stroke-dasharray="2 6"` : `stroke-dasharray="4 4"`;
      pipes += `<line x1="${a[0]}" y1="${a[1]}" x2="${e[0]}" y2="${e[1]}" stroke="${pipeCol[best]}" stroke-width="4" stroke-linecap="round" ${dash}/>`;
      if (best==="blocked") { const m = [(a[0]+e[0])/2,(a[1]+e[1])/2]; pipes += `<g transform="translate(${m[0]},${m[1]})"><circle r="10" fill="#fff" stroke="#C93A30" stroke-width="2"/><path d="M-4,-4 L4,4 M4,-4 L-4,4" stroke="#C93A30" stroke-width="2.5"/></g>`; }
    });
    drawOrder.forEach(k => { const b = B[k]; builds += box(b.x,b.y,b.w,b.d,b.h,b.roof,false);
      const lp = pt(b.x + b.w/2, b.y + b.d/2, b.h); builds += `<text x="${lp[0]}" y="${lp[1]-30}" text-anchor="middle" font-size="12" font-weight="700" fill="#1B2635" paint-order="stroke" stroke="#F1F7FC" stroke-width="4">${b.label}</text>`;
      const parts = D.parts.filter(p=>p.dept===k);
      parts.forEach((p,i) => { const bx = lp[0] + (i - (parts.length-1)/2)*24, by = lp[1]-12;
        const col = pipeCol[p.st]; beacons += `<g class="bc" data-ref="part:${p.id}" tabindex="0" role="button" aria-label="Part ${p.id}: ${esc(p.name)}, ${PART_WORD[p.st]}"><line x1="${bx}" y1="${by}" x2="${bx}" y2="${lp[1]}" stroke="#1B2635" stroke-width="1.5"/><circle cx="${bx}" cy="${by}" r="10" fill="${p.st==="notstarted"||p.st==="building"?"#fff":col}" stroke="${col}" stroke-width="2" ${p.st==="building"?'stroke-dasharray="3 2"':""}/><text x="${bx}" y="${by+4}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${p.st==="notstarted"||p.st==="building"?"#1B2635":"#fff"}">${p.id}</text></g>`; });
    });
    const bill = box(12.8,3.4,1.8,1.8,1.6,"",true); const bl = pt(13.7,4.3,1.6);
    const bp1 = pt(ec[0],ec[1],0.15), bp2 = pt(13.7,4.3,0.15);
    const ground = poly([pt(-0.6,-0.8),pt(14.8,-0.8),pt(14.8,11.6),pt(-0.6,11.6)], "#E3EEDD", `stroke="#C9DAC2" stroke-width="2"`);
    let grid = ""; for (let i=0;i<=14.8;i+=1.5){ const a=pt(i,-0.8),b=pt(i,11.6); grid += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#D2E2CB"/>`; } for (let j=-0.8;j<=11.6;j+=1.55){ const a=pt(-0.6,j),b=pt(14.8,j); grid += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#D2E2CB"/>`; }
    const slab = poly([pt(-0.6,11.6),pt(14.8,11.6),pt(14.8,11.6,-0.5),pt(-0.6,11.6,-0.5)],"#C7D8C0") + poly([pt(14.8,-0.8),pt(14.8,11.6),pt(14.8,11.6,-0.5),pt(14.8,-0.8,-0.5)],"#B5C9AE");
    const scene = `<svg viewBox="0 -30 900 530" role="img" aria-label="Model of the hospital: each department that feeds the summary is piped to the summary engine.">${slab}${ground}${grid}${pipes}
      <line x1="${bp1[0]}" y1="${bp1[1]}" x2="${bp2[0]}" y2="${bp2[1]}" stroke="#8E9AAB" stroke-width="3" stroke-dasharray="2 6"/>
      ${builds}${bill}<text x="${bl[0]}" y="${bl[1]-14}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#566275">Billing & Insurance</text><text x="${bl[0]}" y="${bl[1]}" text-anchor="middle" font-size="10.5" fill="#566275">next suite · 2 hand-offs</text>${beacons}</svg>`;

    /* ---- lift shafts ---- */
    const shaft = k => { const n = Math.min(1,prog(k,k.now)), p = prog(k,k.plan); const col = k.state==="ahead"?"#1B8A4B":k.state==="watch"?"#E09B1A":"#C93A30"; const H=220, pad=30;
      const y = v => pad/2 + v*(H-pad*1.6);
      return `<button class="shaft" type="button" data-ref="kpi:${k.id}"><span class="tube" aria-hidden="true"><span class="tgt">${fmtv(k,k.target)}</span>${[0,.25,.5,.75,1].map(f=>`<span class="fln" style="bottom:${y(f)}px"></span>`).join("")}
        <span class="ghost" style="bottom:${y(p)}px"></span><span class="car" style="bottom:${y(n)}px;background:${col}">NOW</span></span>
        <b class="${k.state}">${fmtv(k,k.now)}</b><span class="nm">${esc(k.short)}</span><span class="st ${k.state}">${STATE_WORD[k.state].toUpperCase()}</span></button>`; };

    const mate = p => { const pc = p.done/p.due; const hat = p.state==="ahead"?"#1B8A4B":p.state==="watch"?"#E09B1A":"#C93A30"; const R=24, Cc=2*Math.PI*R;

      const edge = st==="blocked" ? "#B93A12" : "#23280F";
      return `<path d="${d}" fill="none" stroke="${edge}" stroke-width="16" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#4A4F38" stroke-width="11" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#8B8F72" stroke-width="1.5" stroke-dasharray="3 7"/>`; };
    const parcel = (id, st, i) => { const box = `<rect x="-7" y="-7" width="14" height="14" rx="2" fill="#F2A900" stroke="#8A6200"/><line x1="-7" x2="7" y1="0" y2="0" stroke="#C78B00" stroke-width="2"/>`;
      if (st==="live") return [0,1].map(k=>`<g>${box}<animateMotion dur="3s" begin="${(k*1.5+i*.25).toFixed(2)}s" repeatCount="indefinite"><mpath href="#bp${id}"/></animateMotion></g>`).join("");
      if (st==="testing") return `<g>${box}<animateMotion dur="7.5s" begin="${i*.5}s" repeatCount="indefinite"><mpath href="#bp${id}"/></animateMotion></g>`;
      if (st==="blocked") return `<g>${box.replace(/#F2A900/,"#F7B9A3")}<animateMotion dur="1s" fill="freeze" keyPoints=".45;.45" keyTimes="0;1" calcMode="linear"><mpath href="#bp${id}"/></animateMotion></g>`;
      return ""; };
    const board = (p, x, y, w, h) => `<g class="hp" data-ref="part:${p.id}" data-part="${p.id}" tabindex="0" role="button" aria-label="Part ${p.id}: ${esc(p.name)}, ${PART_WORD[p.st]}">
      <rect class="bd" x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="#FFFFFF" stroke="#23280F" stroke-width="1.8"/>
      <rect x="${x}" y="${y}" width="${w}" height="7" rx="3" fill="${C[p.st]}"/>
      <text x="${x+10}" y="${y+30}" font-family="Bebas Neue, sans-serif" font-size="22" fill="${p.st==="notstarted"||p.st==="building"?"#8B8F72":C[p.st]}">${String(p.id).padStart(2,"0")}</text>
      <foreignObject x="${x+34}" y="${y+10}" width="${w-38}" height="${h-12}"><div xmlns="http://www.w3.org/1999/xhtml" style="font:600 10.5px/1.25 Poppins,sans-serif;color:#23280F">${esc(p.name)}<div style="font-weight:400;font-size:9.5px;color:${p.st==="notstarted"||p.st==="building"?"#5F6449":C[p.st]}">${PART_WORD[p.st]} · ${esc(p.when.replace(/^Live since /,"since ").replace(/^Goes live /,"live "))}</div></div></foreignObject></g>`;
    top.forEach((p,i) => { const x = 15 + i*(bw+gap), y = 34, h = 100; const cx = x + bw/2; const tx = sx + 30 + i*(sw-60)/(top.length-1);
      const d = `M${cx},${y+h+4} L${cx},${y+h+40} L${tx},${sy-26} L${tx},${sy-4}`;
      belts += belt(p.id, d, p.st) + `<path d="M${cx-18},${y+h+4} L${cx+18},${y+h+4} L${cx+8},${y+h+18} L${cx-8},${y+h+18} Z" fill="#5C6B1E"/>`;
      parcels += parcel(p.id, p.st, i);
      if (p.st==="blocked") { const mx = (cx+tx)/2, my = (y+h+40+sy-26)/2; parcels += `<g transform="translate(${mx+16},${my})"><circle r="10" fill="#fff" stroke="#B93A12" stroke-width="2"/><text y="4" text-anchor="middle" font-size="12" font-weight="700" fill="#B93A12">!</text></g>`; }
      boards += board(p, x, y, bw, h); });
    const ow = 190, og = (W - 30 - outs.length*ow)/(outs.length-1);
    outs.forEach((p,i) => { const x = 15 + i*(ow+og), y = 580, h = 70; const cx = x + ow/2; const fx = sx + 40 + i*(sw-80)/(outs.length-1);
      const d = `M${fx},${sy+sh+4} L${fx},${sy+sh+24} L${cx},${y-34} L${cx},${y-6}`;
      belts += belt(p.id, d, p.st); parcels += parcel(p.id, p.st, i+8);
      boards += `<path d="M${x+10},${y-4} L${x+ow-10},${y-4} L${x+ow-24},${y+h} L${x+24},${y+h} Z" fill="#E7E3CB"/>` + board(p, x, y, ow, h); });
    const engine = `<g aria-label="The billing engine">
      <polygon points="${sx},${sy} ${sx+18},${sy-18} ${sx+sw+18},${sy-18} ${sx+sw},${sy}" fill="#7A8A2E"/>
      <polygon points="${sx+sw},${sy} ${sx+sw+18},${sy-18} ${sx+sw+18},${sy+sh-18} ${sx+sw},${sy+sh}" fill="#2C3410"/>
      <rect x="${sx}" y="${sy}" width="${sw}" height="${sh}" rx="4" fill="#3B4512"/>
      ${Array.from({length:12},(_,i)=>`<line x1="${sx+12+i*28}" x2="${sx+26+i*28}" y1="${sy+sh-10}" y2="${sy+sh-10}" stroke="#F2A900" stroke-width="4"/>`).join("")}
      <text x="${sx+18}" y="${sy+30}" font-family="Bebas Neue, sans-serif" font-size="24" fill="#FFD466" letter-spacing="1.5">BILLING ENGINE</text>
      <text x="${sx+18}" y="${sy+48}" font-size="10" fill="#CFD3B0">prices each charge and sorts it onto the right bill</text>
      <rect x="${sx+18}" y="${sy+58}" width="${sw-36}" height="40" rx="4" fill="#1A1F08"/>
      <text x="${sx+30}" y="${sy+76}" font-size="9" fill="#CFD3B0" letter-spacing="1.2">POSTED TODAY</text>
      <text id="s8amt" x="${sx+30}" y="${sy+93}" font-family="Bebas Neue, sans-serif" font-size="20" fill="#FFD466">₹18,42,300</text>
      <text id="s8cnt" x="${sx+170}" y="${sy+76}" font-size="9.5" fill="#CFD3B0">1,284 charges</text>
      <text id="s8last" x="${sx+170}" y="${sy+92}" font-size="10" fill="#FFD466">Lab · CBC · ₹450 · Bed 214</text></g>`;
    const heads = `<text x="15" y="22" font-size="11" font-weight="700" letter-spacing="1.5" fill="#5C6B1E">EVENTS IN THE STAY, AND THE CHARGE LIST</text><text x="15" y="${H-6}" font-size="11" font-weight="700" letter-spacing="1.5" fill="#5C6B1E">BILLS GOING OUT</text>
      <text x="${W-15}" y="${H-6}" text-anchor="end" font-size="10.5" fill="#5F6449">The signed summary for claims comes from the Discharge Summary suite</text>`;
    const floor = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Seven kinds of event and the charge list drop into the billing engine, which sends bills down to the family and the insurers."><defs>${defs}</defs>${heads}${belts}${engine}${parcels}${boards}</svg>`;

    /* --- KPI dials --- */
    const dl = k => { const n = Math.min(1,prog(k,k.now)), p = Math.min(1,prog(k,k.plan)); const col = k.state==="ahead"?"#2F7D32":k.state==="watch"?"#D49400":"#B93A12";
      const a0 = Math.PI*0.75, sweep = Math.PI*1.5, cx = 60, cy = 58, r = 44; const at = (f,rr=r) => [cx + rr*Math.cos(a0+f*sweep), cy + rr*Math.sin(a0+f*sweep)];
      const arc = (f1,f2,rr) => { const [x1,y1] = at(f1,rr), [x2,y2] = at(f2,rr); return `M${x1.toFixed(1)},${y1.toFixed(1)} A${rr},${rr} 0 ${(f2-f1)*sweep>Math.PI?1:0} 1 ${x2.toFixed(1)},${y2.toFixed(1)}`; };
      const [nx,ny] = at(n, r-12), [p1x,p1y] = at(p, r+5), [p2x,p2y] = at(p, r-8);
      const ticks = Array.from({length:11},(_,i)=>{ const [a,b]=at(i/10,r-2),[c,d]=at(i/10,r-(i%5?6:10)); return `<line x1="${a.toFixed(1)}" y1="${b.toFixed(1)}" x2="${c.toFixed(1)}" y2="${d.toFixed(1)}" stroke="#5F6449" stroke-width="${i%5?1:2}"/>`; }).join("");
      return `<button class="dl" type="button" data-ref="kpi:${k.id}"><svg viewBox="0 0 120 104" aria-hidden="true"><circle cx="${cx}" cy="${cy}" r="${r+8}" fill="#F7F4E2" stroke="#23280F" stroke-width="2"/><path d="${arc(0,1,r)}" fill="none" stroke="#E5E1C8" stroke-width="7"/><path d="${arc(0,Math.max(.01,n),r)}" fill="none" stroke="${col}" stroke-width="7"/>${ticks}
        <line x1="${p1x.toFixed(1)}" y1="${p1y.toFixed(1)}" x2="${p2x.toFixed(1)}" y2="${p2y.toFixed(1)}" stroke="#23280F" stroke-width="2" stroke-dasharray="2 2"/><line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#23280F" stroke-width="3" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="5" fill="#F2A900" stroke="#23280F"/>
        <text x="${cx}" y="${cy+30}" text-anchor="middle" font-size="9" fill="#5F6449">target ${fmtv(k,k.target)}</text></svg>
        <span><span class="nm">${esc(k.name)}</span><b class="${k.state}">${fmtv(k,k.now)}</b><span class="st ${k.state}">${STATE_WORD[k.state].toUpperCase()} · ${gapText(k)}</span><span class="rg">From ${fmtv(k,k.base)} · plan now ${fmtv(k,k.plan)}</span></span></button>`; };

    /* --- people --- */
    const pl = p => { const tgc = p.state==="ahead"?"#2F7D32":p.state==="watch"?"#A86B00":"#B93A12"; let body;
      if (UI.view==="day") body = `<ul>${p.today.map(t=>`<li class="${t[1]===1?"y":String(t[1]).startsWith("late")?"l":""}">${esc(t[0])}${t[1]!==1?` · <span style="font-weight:400">${esc(t[1])}</span>`:""}</li>`).join("")}</ul>`;
      else { const b = []; for (let i=0;i<p.due;i++) b.push(`<i class="${i<p.done?"":i<p.done+p.late?"l":"p"}"></i>`); body = `<span class="bars" aria-label="${p.done} of ${p.due} done, ${p.late} late">${b.join("")}</span><span class="meta"><b>${p.done}</b> of ${p.due} done${p.late?` · <b style="color:var(--bad)">${p.late}</b> late`:""}</span>`; }
      return `<button class="pl" type="button" data-ref="per:${p.key}"><span class="top"><b>${esc(p.name)}</b><em style="background:${tgc}">${PERSON_WORD[p.state].toUpperCase()}</em></span><span class="bd2"><span class="role">${esc(p.role)}</span>${body}${p.impact?`<span class="imp">${esc(p.impact)}</span>`:`<span class="nx">Next: ${esc(p.next[0][0])} · ${esc(p.next[0][1])}</span>`}</span></button>`; };

    /* --- money: area chart --- */
    const CW = 760, CH = 290, x0 = 46, x1 = 740, y0 = 24, y1 = 240, vmax = 45, n = D.cumMonths.length;
    const bx = i => x0 + (x1-x0)*i/(n-1), by = v => y1 - (y1-y0)*v/vmax;
    const line = (a,f,t) => a.slice(f,t+1).map((v,j)=>`${j?"L":"M"}${bx(f+j).toFixed(1)},${by(v).toFixed(1)}`).join(" ");
    let g = ""; [0,10,20,30,40].forEach(v => g += `<line x1="${x0}" x2="${x1}" y1="${by(v)}" y2="${by(v)}" stroke="#EFEDDD"/><text x="${x0-8}" y="${by(v)+4}" text-anchor="end" font-size="10" fill="#5F6449">${v}</text>`);
    D.cumMonths.forEach((m,i) => g += `<text x="${bx(i)}" y="${y1+18}" text-anchor="middle" font-size="11" font-weight="600" fill="${i>D.actualTo?"#5F6449":"#23280F"}">${m}</text><rect data-ref="month:${i}" data-nopen x="${bx(i)-34}" y="${y0}" width="68" height="${y1-y0}" fill="transparent" style="cursor:help"/>`);
    const area = line(D.cumFore,0,n-1) + ` L${bx(n-1)},${y1} L${bx(0)},${y1} Z`;
    g += `<path d="${area}" fill="#F2A900" fill-opacity=".25"/><path d="${line(D.cumFore,0,D.actualTo)}" fill="none" stroke="#C78B00" stroke-width="3"/><path d="${line(D.cumFore,D.actualTo,n-1)}" fill="none" stroke="#C78B00" stroke-width="2.5" stroke-dasharray="4 4"/>
      <path d="${line(D.cumPlan,0,n-1)}" fill="none" stroke="#5F6449" stroke-width="1.5" stroke-dasharray="2 4"/><path d="${line(D.cumSpend,0,n-1)}" fill="none" stroke="#3B4512" stroke-width="3"/>
      <line x1="${bx(4)}" x2="${bx(4)}" y1="${y0}" y2="${y1}" stroke="#5F6449" stroke-dasharray="3 3"/><text x="${bx(4)}" y="${y0-8}" text-anchor="middle" font-size="10.5" fill="#5F6449">plan break-even</text>
      <g transform="translate(${bx(6)},${by(D.cumFore[6])})"><line x1="0" y1="0" x2="0" y2="-46" stroke="#B93A12" stroke-width="2"/><path d="M0,-46 L24,-39 L0,-32 Z" fill="#B93A12"/><text x="28" y="-36" font-size="11" font-weight="700" fill="#B93A12">Mar</text></g>
      <rect x="${x0}" y="${CH-20}" width="14" height="4" fill="#3B4512"/><text x="${x0+20}" y="${CH-14}" font-size="11" fill="#23280F">Money out to date</text><rect x="${x0+150}" y="${CH-24}" width="14" height="12" fill="#F2A900" fill-opacity=".5" stroke="#C78B00"/><text x="${x0+170}" y="${CH-14}" font-size="11" fill="#23280F">EBITDA back to date (dashed: forecast)</text><text x="${x0+430}" y="${CH-14}" font-size="11" fill="#5F6449">dotted: plan · ₹ lakh</text>`;
    const chart = `<svg viewBox="0 0 ${CW} ${CH}" role="img" aria-label="Money out and EBITDA back to date. EBITDA back passes money out in March; the plan said January.">${g}</svg>`;

    return `<div class="s8"><div class="wrap">
      <nav class="rail" aria-label="Suite sections"><div class="now" aria-hidden="true"><small>YOU ARE ON</small><span id="s8at">OVERVIEW</span></div>
        ${TABS.map((t,i)=>`<button class="tg ${i?"":"on"}" type="button" data-tab="${t[0]}"><span>${t[1]}</span></button>`).join("")}</nav>
      <div class="head"><div><small>AUTOMATION SUITE · ${esc(D.family.toUpperCase())} · ${esc(D.hospital.toUpperCase())}</small><h2>${esc(D.suite)}</h2></div>
        <div class="crates" aria-label="Pulse strip">${crates}</div></div>
      <div class="strip" aria-label="Watch list and next go-live">${D.watch.map(w=>`<button class="held" type="button" data-ref="${w.ref}">${esc(w.t)}<small>${esc(P[w.who].name)}</small></button>`).join("")}
        <button class="label" type="button" data-ref="part:${D.milestone.part}"><b>${D.milestone.days}</b><span>DAYS TO THE NEXT GO-LIVE<small>${esc(D.milestone.what)} · ${D.milestone.date}</small></span></button></div>
      <section class="zone" data-zone="links" style="margin-top:0;border:0;padding:0"><p class="swipe">Swipe sideways to see every line →</p><div class="floor">${floor}</div>
        <div class="legend"><span><i style="background:#2F7D32"></i>Live</span><span><i style="background:#D49400"></i>Testing</span><span><i style="background:repeating-linear-gradient(90deg,#A9A88F 0 3px,transparent 3px 5px)"></i>Being built</span><span><i style="background:#B93A12"></i>Late</span><span><i style="background:#D6D4C2"></i>Not started</span><span>· Data as of ${esc(D.asOf)}</span></div></section>
      <section class="zone" data-zone="measures"><div class="zh"><h3>KPIs</h3><p>Needle is today · dashed tick is the plan for this week · the end of the scale is the target</p></div>
        <div class="dials">${D.kpis.map(dl).join("")}</div></section>
      <section class="zone" data-zone="team"><div class="zh"><h3>Taskboards</h3>${viewToggle("vt")}</div><div class="labels">${D.people.map(pl).join("")}</div></section>
      <section class="zone" data-zone="health"><div class="zh"><h3>Project Status</h3><p>₹ lakh to date, by month</p></div>
        <div class="money"><div class="chart">${chart}</div>
          <div class="mlist">
            <button type="button" data-ref="month:1">Subscription<b>${L(2.0)}/mo</b></button>
            <button type="button" data-ref="month:1">Night insurance coordinator we recommended<b>${L(0.25)}/mo</b></button>
            <button type="button" data-ref="month:1">One-time so far<b>${L(3.0)}</b></button>
            <button type="button" data-ref="health:0">Extra revenue so far<b>${L(revTotal)}</b></button>
            <button type="button" data-ref="health:0">EBITDA now<b>${L(D.ebitda[1])}/mo</b></button>
            <button type="button" data-ref="health:0">EBITDA at full run<b>${L(D.runRate.ebitda)}/mo</b></button>
            <button type="button" class="why" data-ref="health:0">Break-even ${D.breakeven.fore}, ${D.breakeven.late} late<b>See why and the recovery plan ›</b></button>
          </div></div></section>
    </div></div>`;
  },
  after(){
    document.querySelectorAll(".s8 .tg").forEach(b => b.addEventListener("click", () => { const at = document.getElementById("s8at"); if (at) at.textContent = b.textContent.trim().toUpperCase(); }));
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { document.querySelectorAll(".s8 animateMotion").forEach(a => a.remove()); return; }
    tickEngine("s8", ".s8 .hp");
  }
});

const PAGE = {"mode": "pages", "title": "Automation suites · approved landing pages", "sub": "Every approved suite landing, live and interactive, for the development team. Example figures for a 250-bed hospital in Bhubaneswar."};
/* ===== init: one runtime, three page modes =====
   PAGE.mode "review"  → one suite, several look options (PAGE.suite, PAGE.schemes)
   PAGE.mode "pages"   → every approved suite landing, one picker (for the development team)
   PAGE.mode "library" → the suite block library (91-library.js) */
const SCHEME_SUITE = { monitor:"discharge", sheet:"discharge", diorama:"discharge", departures:"discharge", dispensary:"discharge",
  tubes:"billing", meters:"billing", sorter:"billing", signal:"admission", radar:"admission" };
const APPROVED = [["discharge","diorama"],["billing","sorter"]];
const stage = document.getElementById("stage"), picks = document.getElementById("picks");
const css = document.createElement("style"); css.textContent = SCHEMES.map(s=>s.css).join("\n"); document.head.appendChild(css);
const byKey = k => SCHEMES.find(s=>s.key===k);
let LIST = [];
if (PAGE.mode === "pages") LIST = APPROVED.filter(a=>byKey(a[1]) && SUITES.find(s=>s.key===a[0])).map(([su,k],i)=>({ suite:su, scheme:byKey(k), letter:String(i+1), label:SUITES.find(s=>s.key===su).data.suite }));
else if (PAGE.mode === "review") LIST = PAGE.schemes.map(k=>({ suite:PAGE.suite, scheme:byKey(k), letter:byKey(k).letter, label:byKey(k).name }));
document.getElementById("rvTitle").textContent = PAGE.title;
document.getElementById("rvSub").textContent = PAGE.sub;
if (PAGE.mode === "library") { picks.hidden = true; setSuite(SUITES[0].key); renderLibrary(); }
else {
  picks.innerHTML = LIST.map((s,i)=>`<button type="button" data-i="${i}" aria-pressed="${i===0}"><b>${esc(s.letter)}</b>${esc(s.label)}</button>`).join("");
  picks.onclick = e => { const b = e.target.closest("button"); if (!b) return; UI.scheme = +b.dataset.i; try { localStorage.setItem("suitePick-"+PAGE.mode+(PAGE.suite||""), UI.scheme); } catch(_){} render(); scrollTo(0,0); };
  if (LIST.length === 1) picks.hidden = true;
  try { const v = +localStorage.getItem("suitePick-"+PAGE.mode+(PAGE.suite||"")); if (v >= 0 && v < LIST.length) UI.scheme = v; } catch(_){}
  const hashMap = {a:0,b:1,c:2,d:3,e:4}; const hv = hashMap[location.hash.slice(1)]; if (hv !== undefined && hv < LIST.length) UI.scheme = hv;
  if (UI.scheme >= LIST.length) UI.scheme = 0;
  render();
}
function render(){
  if (PAGE.mode === "library") return renderLibrary();
  const it = LIST[UI.scheme], s = it.scheme;
  setSuite(it.suite);
  picks.querySelectorAll("button").forEach((b,i)=>b.setAttribute("aria-pressed", i===UI.scheme));
  document.getElementById("rvNote").innerHTML = PAGE.mode === "pages" ? `<b>${esc(D.suite)}</b> · approved look: ${esc(s.name.toLowerCase())}. ${esc(D.hospital)}, week ${D.week} of ${D.weeksPlanned}. Example figures.` : s.note;
  Object.entries(s.vars).forEach(([k,v]) => document.documentElement.style.setProperty(k, v));
  document.getElementById("chatFab").style.bottom = `calc(${s.fab||18}px + env(safe-area-inset-bottom,0px))`;
  stage.innerHTML = `<div data-suite="${it.suite}">${s.render()}</div>`;
  markTab(document.body.classList.contains("chat-open") ? "chat" : lastTab);
  if (s.after) s.after();
}

</script>
